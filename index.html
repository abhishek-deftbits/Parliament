<!DOCTYPE html>
<html lang="ne" x-data="parliamentApp" :class="{ 'dark': theme === 'dark' }">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title
        x-text="lang === 'ne' ? 'माननीय निश्कल राई — प्रतिनिधि सभा सदस्य, इलाम–१' : 'Hon. Nishcal Rai — Member of Parliament, Ilam-1, Nepal'">
        Hon. Nishcal Rai — Member of Parliament, Ilam-1
    </title>
    <meta name="description"
        content="Official website of Hon. Nishcal Rai, Member of the House of Representatives (Federal Parliament of Nepal), Ilam Constituency No. 1. Citizen services, parliamentary speeches, constituency development projects, and public grievance portal.">

    <!-- Google Fonts Preconnect & Stylesheets -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Mukta:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Core & Component Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">

    <!-- Structured Data & Application Scripts -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
</head>

<body :data-lang="lang">

    <!-- Dynamic Modular Header (Loaded from header.html) -->
    <div id="site-header"></div>

    <!-- ======================================================================
         Main Page Content
         ====================================================================== -->
    <main>

        <!-- Presidential Hero Section -->
        <section class="hero-section" id="home">
            <!-- Ambient dot pattern -->
            <div class="hero-bg-pattern"></div>

            <!-- Cinematic Full-Bleed Portrait (right side, absolutely placed) -->
            <img :src="profile.photoUrl" :alt="profile.nameEn" class="hero-cinematic-portrait" loading="eager"
                onerror="this.src='https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=1200&q=85'">

            <!-- Gradient Mask: keeps left text crisp, portrait blends to the right -->
            <div class="hero-portrait-mask"></div>
            <div class="hero-bottom-vignette"></div>

            <!-- Content (left) -->
            <div class="hero-grid">
                <div class="hero-content">
                    <!-- Parliamentary Authority Crest -->
                    <div class="hero-authority-badge">
                        <div class="hero-emblem-pip">
                            <i class="fas fa-landmark"></i>
                        </div>
                        <div class="hero-authority-text">
                            <span class="hero-authority-sup"
                                x-text="lang === 'ne' ? 'नेपालको संघीय संसद्' : 'Federal Parliament of Nepal'"></span>
                            <span class="hero-authority-sub"
                                x-text="lang === 'ne' ? 'प्रतिनिधि सभा • इलाम निर्वाचन क्षेत्र नं. १' : 'House of Representatives • Constituency Ilam-1'"></span>
                        </div>
                    </div>

                    <!-- Monumental Name -->
                    <h1 class="hero-name-grand" x-text="lang === 'ne' ? profile.nameNe : profile.nameEn"></h1>

                    <div class="hero-role-ribbon">
                        <i class="fas fa-user-shield" style="color: #fbbf24; font-size: 1.05rem;"></i>
                        <span class="hero-role-title"
                            x-text="lang === 'ne' ? 'माननीय सांसद' : 'Honorable Member of Parliament'"></span>
                        <span class="hero-role-sep">•</span>
                        <span class="hero-role-party"
                            x-text="lang === 'ne' ? 'नेपाली कांग्रेस' : 'Nepali Congress'"></span>
                    </div>

                    <!-- Manifesto Quote -->
                    <p class="hero-manifesto-lead" x-text="lang === 'ne' ? profile.manifestoNe : profile.manifestoEn">
                    </p>

                    <!-- Legislative Focus Pillars Docket (Replaces generic AI pills) -->
                    <div class="hero-pillars-deck">
                        <div class="hero-pillars-header">
                            <span class="hero-pillars-kicker"
                                x-text="lang === 'ne' ? 'प्रमुख नीतिगत प्राथमिकताहरू' : 'Core Legislative Priorities'"></span>
                            <span class="hero-pillars-line"></span>
                        </div>
                        <div class="hero-pillars-grid">
                            <a href="projects.html" class="hero-pillar-item">
                                <span class="pillar-num">01</span>
                                <div class="pillar-meta">
                                    <strong
                                        x-text="lang === 'ne' ? 'अर्थोडक्स चिया रूपान्तरण' : 'Orthodox Tea Economy'"></strong>
                                    <span class="pillar-tag"
                                        x-text="lang === 'ne' ? 'कृषि तथा निर्यात प्रवर्द्धन' : 'Agri-Export & Farmers'"></span>
                                </div>
                            </a>
                            <a href="projects.html" class="hero-pillar-item">
                                <span class="pillar-num">02</span>
                                <div class="pillar-meta">
                                    <strong
                                        x-text="lang === 'ne' ? 'सुलभ स्वास्थ्य बिमा' : 'Universal Healthcare'"></strong>
                                    <span class="pillar-tag"
                                        x-text="lang === 'ne' ? 'नागरिक स्वास्थ्य सुरक्षा' : 'Public Care Access'"></span>
                                </div>
                            </a>
                            <a href="projects.html" class="hero-pillar-item">
                                <span class="pillar-num">03</span>
                                <div class="pillar-meta">
                                    <strong
                                        x-text="lang === 'ne' ? 'सन्दकपुर पर्यटन कोरिडोर' : 'Tourism Corridors'"></strong>
                                    <span class="pillar-tag"
                                        x-text="lang === 'ne' ? 'दिगो पूर्वाधार विकास' : 'Regional Connectivity'"></span>
                                </div>
                            </a>
                            <a href="projects.html" class="hero-pillar-item">
                                <span class="pillar-num">04</span>
                                <div class="pillar-meta">
                                    <strong x-text="lang === 'ne' ? 'युवा नवप्रवर्तन हब' : 'Youth Innovation'"></strong>
                                    <span class="pillar-tag"
                                        x-text="lang === 'ne' ? 'डिजिटल सीप & उद्यम' : 'Skills & Enterprise'"></span>
                                </div>
                            </a>
                        </div>
                    </div>

                    <!-- Executive Civic Actions Console (Side by side on the same line) -->
                    <div class="hero-actions-console">
                        <!-- Action: Speeches & Debates -->
                        <a href="media.html" class="hero-action-card hero-action-secondary">
                            <div class="action-card-icon">
                                <i class="fas fa-landmark"></i>
                            </div>
                            <div class="action-card-content">
                                <div class="action-card-sup" x-text="lang === 'ne' ? 'संसद् रेकर्ड & बहस' : 'Floor Record & Speeches'"></div>
                                <div class="action-card-title" x-text="lang === 'ne' ? 'संसदीय सम्बोधन' : 'Parliamentary Speeches'"></div>
                            </div>
                            <div class="action-card-arrow">
                                <i class="fas fa-arrow-right"></i>
                            </div>
                        </a>

                        <!-- Action: Meeting Request -->
                        <button class="hero-action-card hero-action-meeting" @click="appointmentModal.isOpen = true">
                            <div class="action-card-icon">
                                <i class="fas fa-calendar-check"></i>
                            </div>
                            <div class="action-card-content">
                                <div class="action-card-sup" x-text="lang === 'ne' ? 'कार्यालय भेटघाट' : 'Public Liaison'"></div>
                                <div class="action-card-title" x-text="lang === 'ne' ? 'भेटघाट अनुरोध' : 'Request Meeting'"></div>
                            </div>
                            <div class="action-card-arrow">
                                <i class="fas fa-calendar-plus"></i>
                            </div>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Architectural Stats Counter Strip (Unboxed) -->
        <section class="container" style="position: relative; z-index: 10;">
            <div class="editorial-counter-strip">
                <div class="editorial-counter-grid">
                    <template x-for="stat in stats" :key="stat.id">
                        <div class="editorial-counter-col">
                            <div class="editorial-action-icon"
                                style="background: var(--bg-parliament-subtle); color: var(--parliament-blue);">
                                <i class="fas" :class="stat.icon"></i>
                            </div>
                            <div>
                                <div class="editorial-counter-num">
                                    <span x-text="stat.count"></span><span x-text="stat.suffix"
                                        style="color: var(--accent-red);"></span>
                                </div>
                                <div class="editorial-counter-label"
                                    x-text="lang === 'ne' ? stat.labelNe : stat.labelEn"></div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </section>

        <!-- Citizen Quick Action Directory (Unboxed) -->
        <section class="container">
            <div class="editorial-action-hub">
                <a href="gunaso.html" class="editorial-action-item">
                    <div class="editorial-action-icon"><i class="fas fa-file-signature"></i></div>
                    <div>
                        <div class="editorial-action-title"
                            x-text="lang === 'ne' ? 'जनगुनासो दर्ता' : 'Register Grievance'"></div>
                        <div class="editorial-action-sub"
                            x-text="lang === 'ne' ? 'सडक, खानेपानी, समस्या पठाउनुहोस्' : 'Submit civic issues directly'">
                        </div>
                    </div>
                </a>

                <a href="gunaso.html#track" class="editorial-action-item">
                    <div class="editorial-action-icon"><i class="fas fa-search-location"></i></div>
                    <div>
                        <div class="editorial-action-title"
                            x-text="lang === 'ne' ? 'गुनासो ट्र्याकिङ' : 'Track Status'"></div>
                        <div class="editorial-action-sub"
                            x-text="lang === 'ne' ? 'टिकट नम्बरबाट पछिल्लो अवस्था' : 'Live status tracking'"></div>
                    </div>
                </a>

                <a href="projects.html" class="editorial-action-item">
                    <div class="editorial-action-icon"><i class="fas fa-chart-line"></i></div>
                    <div>
                        <div class="editorial-action-title"
                            x-text="lang === 'ne' ? 'विकास आयोजना' : 'Projects Dossier'"></div>
                        <div class="editorial-action-sub"
                            x-text="lang === 'ne' ? 'बजेट र निर्माण कार्यको पारदर्शिता' : 'Transparent monitoring'">
                        </div>
                    </div>
                </a>

                <a href="media.html" class="editorial-action-item">
                    <div class="editorial-action-icon"><i class="fas fa-video"></i></div>
                    <div>
                        <div class="editorial-action-title"
                            x-text="lang === 'ne' ? 'संसदीय भिडियो' : 'Parliament Archive'"></div>
                        <div class="editorial-action-sub"
                            x-text="lang === 'ne' ? 'सदन बैठक र नीतिगत बहस' : 'Speeches & zero hour debates'"></div>
                    </div>
                </a>
            </div>
        </section>

        <!-- Vision & Policy Ledger Section (Unboxed Architectural List) -->
        <section class="section"
            style="background: var(--bg-surface); border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color);">
            <div class="container">
                <div class="section-header">
                    <span class="section-tag">
                        <i class="fas fa-star" style="color: var(--accent-red); font-size: 0.75rem;"></i>
                        <span
                            x-text="lang === 'ne' ? 'हाम्रो संकल्प र प्रतिज्ञा' : 'Policy Vision & Legislative Pledges'"></span>
                    </span>
                    <h2 class="section-title"
                        x-text="lang === 'ne' ? 'समृद्ध इलाम र समुन्नत नेपालको खाका' : 'Blueprint for Regional Transformation'">
                    </h2>
                    <p class="section-subtitle"
                        x-text="lang === 'ne' ? 'नेपाली कांग्रेसको लोकतान्त्रिक मूल्य, स्पष्ट नीति र नतिजामुखी कार्ययोजना' : 'Democratic values, evidence-based legislation, and concrete public delivery.'">
                    </p>

                    <!-- 4 Stars Divider -->
                    <div class="nc-stars-divider">
                        <div class="nc-star-line"></div>
                        <i class="fas fa-star nc-star"></i>
                        <i class="fas fa-star nc-star"></i>
                        <i class="fas fa-star nc-star"></i>
                        <i class="fas fa-star nc-star"></i>
                        <div class="nc-star-line"></div>
                    </div>
                </div>

                <!-- Unboxed Architectural Ledger -->
                <div class="editorial-ledger-container">
                    <template x-for="pledge in pledges" :key="pledge.id">
                        <div class="editorial-ledger-row">
                            <div class="editorial-ledger-num" x-text="pledge.num"></div>
                            <div>
                                <h3 class="editorial-ledger-title"
                                    x-text="lang === 'ne' ? pledge.titleNe : pledge.titleEn"></h3>
                            </div>
                            <div>
                                <p class="editorial-ledger-desc" x-text="lang === 'ne' ? pledge.descNe : pledge.descEn">
                                </p>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Policy Manifesto Download Strip -->
                <div class="pledge-banner-section"
                    style="border-radius: var(--radius-2xl); margin-top: 4rem; padding: 2.5rem 3rem;">
                    <div class="pledge-banner-grid">
                        <div>
                            <span
                                style="background: rgba(255,255,255,0.2); padding: 0.2rem 0.6rem; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 800; text-transform: uppercase;">
                                <i class="fas fa-file-lines"></i> <span
                                    x-text="lang === 'ne' ? 'आधिकारिक दस्ताबेज' : 'Policy Manifesto'"></span>
                            </span>
                            <h3 class="pledge-banner-title" style="margin-top: 0.75rem;"
                                x-text="lang === 'ne' ? 'इलाम–१ विकास मार्गचित्र तथा प्रतिज्ञा पत्र २०८२+' : 'Ilam-1 Development Blueprint & Policy Pledge'">
                            </h3>
                            <p class="pledge-banner-desc"
                                x-text="lang === 'ne' ? 'चिया किसानको समृद्धि, सडक सञ्जालको स्तरोन्नति, गुणस्तरीय स्वास्थ्य बिमा र युवा उद्यमशीलताका नीतिगत प्रतिबद्धताहरू समेटिएको दस्तावेज।' : 'Comprehensive policy document outlining actionable roadmaps for agro-industrialization, universal healthcare, and STEM education.'">
                            </p>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 1rem; justify-content: center;">
                            <a href="https://nepalicongress.org/election2082/pratigya-patra" target="_blank"
                                rel="noopener" class="btn btn-accent btn-lg" style="width: 100%;">
                                <i class="fas fa-file-arrow-down"></i>
                                <span
                                    x-text="lang === 'ne' ? 'प्रतिज्ञा पत्र अध्ययन गर्नुहोस्' : 'Download Policy Pledge'"></span>
                            </a>
                            <a href="https://nepalicongress.org" target="_blank" rel="noopener"
                                class="btn btn-outline btn-lg"
                                style="color: #ffffff; border-color: rgba(255,255,255,0.4); width: 100%;">
                                <i class="fas fa-tree"></i>
                                <span
                                    x-text="lang === 'ne' ? 'नेपाली कांग्रेस आधिकारिक पोर्टल' : 'Nepali Congress Official'"></span>
                                <i class="fas fa-arrow-up-right-from-square"
                                    style="font-size: 0.8rem; margin-left: 4px;"></i>
                            </a>
                        </div>
                    </div>
                </div>

            </div>
        </section>

        <!-- Brief Profile Section -->
        <section class="section" id="about">
            <div class="container">
                <div class="section-header">
                    <span class="section-tag"
                        x-text="lang === 'ne' ? 'परिचय तथा दृष्टिकोण' : 'Leadership & Profile'"></span>
                    <h2 class="section-title"
                        x-text="lang === 'ne' ? 'जनप्रतिनिधि परिचय' : 'About the Member of Parliament'"></h2>
                    <p class="section-subtitle"
                        x-text="lang === 'ne' ? 'इलाम–१ को सम्भावनालाई अवसरमा बदल्ने प्रतिबद्धता' : 'Championing Regional Prosperity, Democratic Values & Transparent Governance'">
                    </p>
                    <div class="section-divider"></div>
                </div>

                <div class="about-grid">
                    <div class="about-portrait-frame">
                        <img :src="profile.photoUrl" :alt="profile.nameEn" class="about-portrait-img">
                    </div>
                    <div class="about-text-content">
                        <h3 style="font-family: var(--font-heading); font-size: 2rem; font-weight: 900; color: var(--parliament-blue); margin-bottom: 1rem;"
                            x-text="lang === 'ne' ? 'इलाम–१ का जनताको सुखदुःखको सहयात्री' : 'A Dedicated Voice for the People of Ilam-1'">
                        </h3>

                        <p style="font-size: 1.1rem; color: var(--text-main); margin-bottom: 1.25rem; line-height: 1.8;"
                            x-text="lang === 'ne' 
                            ? 'इलाम–१ अपार सम्भावनाले भरिएको उर्वर भूमि हो। तर सम्भावना आफैं अवसर बन्दैन, त्यसका लागि स्पष्ट दृष्टि, योजना र इमानदार नेतृत्व चाहिन्छ। किसानका पसिनाको मूल्य, युवाका लागि गुणस्तरीय प्राविधिक शिक्षा र स्थानीय अर्थतन्त्रलाई मजबुत बनाउन म संघीय संसद्मा निरन्तर समर्पित छु।'
                            : 'Ilam-1 is a land of boundless potential. However, potential does not automatically become prosperity—it demands integrity, structured policy, and empathetic leadership. From agricultural market linkages to modern youth skill academies, my legislative mandate is dedicated to serving every citizen with full transparency.'">
                        </p>

                        <div class="editorial-pullquote" style="margin: 2rem 0;">
                            <blockquote>
                                <p
                                    x-text="lang === 'ne' 
                                    ? '“संसदमा तपाईको सशक्त आवाज, विकासमा हाम्रो इमानदार प्रयास। परिणाममुखी नेतृत्व र समृद्ध इलामका लागि निरन्तर समर्पित।”' 
                                    : '“Integrity in legislation, agility in constituency service, and dedication to transparent governance for a prosperous Ilam.”'">
                                </p>
                                <cite x-text="lang === 'ne' ? '— माननीय निश्कल राई' : '— Hon. Nishcal Rai, MP'"></cite>
                            </blockquote>
                        </div>

                        <div style="margin-top: 2rem;">
                            <a href="about.html" class="btn btn-primary btn-lg">
                                <span
                                    x-text="lang === 'ne' ? 'विस्तृत जीवनी र राजनीतिक यात्रा हेर्नुहोस्' : 'Read Full Presidential Biography'"></span>
                                <i class="fas fa-arrow-right"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Brief Featured Projects Section (Unboxed Architectural Ledger) -->
        <section class="section section-muted" id="projects">
            <div class="container">
                <div class="section-header">
                    <span class="section-tag" x-text="lang === 'ne' ? 'विकास आयोजना' : 'Development Projects'"></span>
                    <h2 class="section-title"
                        x-text="lang === 'ne' ? 'प्रमुख विकास आयोजनाहरू' : 'Constituency Development Dossier'"></h2>
                    <p class="section-subtitle"
                        x-text="lang === 'ne' ? 'सडक, चिया प्रशोधन, खानेपानी र अस्पताल स्तरोन्नति' : 'High-impact infrastructure, agriculture, and healthcare initiatives in Ilam-1'">
                    </p>
                    <div class="section-divider"></div>
                </div>

                <!-- Unboxed Architectural Project Ledger -->
                <div class="editorial-project-ledger">
                    <template x-for="project in projects.slice(0, 4)" :key="project.id">
                        <div class="editorial-project-row">
                            <div>
                                <div class="editorial-project-sector"
                                    x-text="lang === 'ne' ? project.categoryNe : project.categoryEn"></div>
                                <h4 class="editorial-project-name"
                                    x-text="lang === 'ne' ? project.titleNe : project.titleEn"></h4>
                                <span style="font-size: 0.85rem; color: var(--text-muted);"><i class="fas fa-map-pin"
                                        style="color: var(--accent-red);"></i> <span
                                        x-text="lang === 'ne' ? project.locationNe : project.locationEn"></span></span>
                            </div>
                            <div>
                                <span
                                    style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;"
                                    x-text="lang === 'ne' ? 'बजेट विनियोजन' : 'Budget'"></span>
                                <div style="font-family: var(--font-heading); font-size: 1.25rem; font-weight: 900; color: var(--parliament-blue);"
                                    x-text="lang === 'ne' ? project.budgetNe : project.budgetEn"></div>
                            </div>
                            <div>
                                <span class="project-status-tag"
                                    :class="project.progress === 100 ? 'status-completed' : 'status-progress'"
                                    x-text="lang === 'ne' ? project.statusNe : project.statusEn"></span>
                            </div>
                            <div>
                                <div class="progress-bar-wrap" style="margin-top: 0;">
                                    <div class="progress-label-row">
                                        <span x-text="lang === 'ne' ? 'भौतिक प्रगति' : 'Physical Progress'"></span>
                                        <span x-text="project.progress + '%'"
                                            style="font-weight: 800; color: var(--parliament-blue);"></span>
                                    </div>
                                    <div class="progress-track" style="height: 8px;">
                                        <div class="progress-fill" :style="'width: ' + project.progress + '%'"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <div style="text-align: center; margin-top: 3.5rem;">
                    <a href="projects.html" class="btn btn-primary btn-lg">
                        <span
