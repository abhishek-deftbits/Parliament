<!DOCTYPE html>
<html lang="ne" x-data="parliamentApp" :class="{ 'dark': theme === 'dark' }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title x-text="lang === 'ne' ? 'माननीय निश्कल राई — प्रतिनिधि सभा सदस्य, इलाम–१' : 'Hon. Nishcal Rai — Member of Parliament, Ilam-1, Nepal'">
        Hon. Nishcal Rai — Member of Parliament, Ilam-1
    </title>
    <meta name="description" content="Official website of Hon. Nishcal Rai, Member of the House of Representatives (Federal Parliament of Nepal), Ilam Constituency No. 1. Citizen services, parliamentary speeches, constituency development projects, and public grievance portal.">

    <!-- Google Fonts Preconnect & Stylesheets -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Mukta:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Core & Component Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">

    <!-- Structured Data & Application Scripts -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
</head>
<body :data-lang="lang">

    <!-- ======================================================================
         Top Civic Bar (Official Parliament Header)
         ====================================================================== -->
    <header class="civic-top-bar">
        <div class="container civic-top-inner">
            <!-- Left: Parliament Seal + MP Quick Info -->
            <a href="https://hr.parliament.gov.np" target="_blank" rel="noopener" class="civic-left" title="House of Representatives, Nepal">
                <img :src="profile.emblemUrl" alt="Emblem of Nepal" class="civic-emblem"
                     onerror="this.src='https://giwmscdntwo.gov.np/static/assets/image/Emblem_of_Nepal.png'">
                <div class="civic-institution">
                    <span class="civic-rep-title" x-text="lang === 'ne' ? 'प्रतिनिधि सभा • संघीय संसद' : 'House of Representatives • Federal Parliament'"></span>
                    <span class="civic-mp-name" x-text="lang === 'ne' ? profile.nameNe : profile.nameEn"></span>
                    <span class="civic-constituency" x-text="lang === 'ne' ? profile.constituencyNe : profile.constituencyEn"></span>
                </div>
            </a>

            <!-- Center: Dynamic News Ticker -->
            <div class="civic-ticker">
                <span class="ticker-label">
                    <i class="fas fa-bullhorn"></i>
                    <span x-text="lang === 'ne' ? 'ताजा समाचार' : 'Updates'"></span>
                </span>
                <div class="ticker-marquee">
                    <marquee scrollamount="4" onmouseover="this.stop()" onmouseout="this.start()">
                        <template x-for="(news, index) in tickerNews" :key="index">
                            <span>
                                <a href="media.html" class="ticker-item" x-text="lang === 'ne' ? news.titleNe : news.titleEn"></a>
                                <span style="margin: 0 12px; opacity: 0.5;">•</span>
                            </span>
                        </template>
                    </marquee>
                </div>
            </div>

            <!-- Right: Date, Language & Theme Controls -->
            <div class="civic-right">
                <div class="civic-date">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/9/9b/Flag_of_Nepal.svg" alt="Nepal Flag" class="civic-flag">
                    <span x-text="lang === 'ne' ? currentDateNe : currentDateEn"></span>
                </div>
                <div class="civic-tools">
                    <button class="lang-btn" :class="{ 'active': lang === 'ne' }" @click="setLanguage('ne')" title="नेपाली">ने</button>
                    <button class="lang-btn" :class="{ 'active': lang === 'en' }" @click="setLanguage('en')" title="English">EN</button>
                    <button class="theme-toggle-btn" @click="toggleTheme()" :title="theme === 'dark' ? 'Light Mode' : 'Dark Mode'">
                        <i class="fas" :class="theme === 'dark' ? 'fa-sun' : 'fa-moon'"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- ======================================================================
         Sticky Main Navigation
         ====================================================================== -->
    <nav class="main-nav" id="navbar">
        <div class="container nav-inner">
            <a href="index.html" class="nav-brand">
                <img src="https://giwmscdntwo.gov.np/static/assets/image/Emblem_of_Nepal.png" alt="Emblem" style="width: 36px; height: 36px;">
                <div>
                    <span class="nav-brand-title" x-text="lang === 'ne' ? profile.nameNe : profile.nameEn"></span>
                    <span class="nav-brand-sub" x-text="lang === 'ne' ? 'इलाम निर्वाचन क्षेत्र नं. १' : 'Ilam Constituency No. 1'"></span>
                </div>
            </a>

            <!-- Navigation Links -->
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link active" x-text="lang === 'ne' ? 'गृहपृष्ठ' : 'Home'"></a></li>
                <li><a href="about.html" class="nav-link" x-text="lang === 'ne' ? 'परिचय' : 'About'"></a></li>
                <li><a href="projects.html" class="nav-link" x-text="lang === 'ne' ? 'विकास आयोजना' : 'Projects'"></a></li>
                <li><a href="media.html" class="nav-link" x-text="lang === 'ne' ? 'मिडिया तथा ग्यालरी' : 'Media & Gallery'"></a></li>
                <li><a href="constituency.html" class="nav-link" x-text="lang === 'ne' ? 'क्षेत्र' : 'Constituency'"></a></li>
                <li><a href="contact.html" class="nav-link" x-text="lang === 'ne' ? 'सम्पर्क' : 'Contact'"></a></li>
            </ul>

            <!-- Quick Action CTA -->
            <div class="nav-actions">
                <a href="gunaso.html" class="btn btn-accent btn-sm">
                    <i class="fas fa-headset"></i>
                    <span x-text="lang === 'ne' ? 'जनगुनासो पोर्टल' : 'Citizen Grievance'"></span>
                </a>
                <button class="mobile-toggle" @click="mobileMenu = !mobileMenu" aria-label="Toggle Mobile Menu">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Mobile Drawer -->
    <div class="mobile-drawer" x-show="mobileMenu" x-cloak style="display: none;">
        <div>
            <div class="mobile-drawer-header">
                <div>
                    <h3 style="font-weight: 800; color: var(--primary);" x-text="lang === 'ne' ? profile.nameNe : profile.nameEn"></h3>
                    <p style="font-size: 0.8rem; color: var(--text-muted);" x-text="lang === 'ne' ? profile.constituencyNe : profile.constituencyEn"></p>
                </div>
                <button class="modal-close-btn" style="position: static;" @click="mobileMenu = false">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="mobile-drawer-links">
                <a href="index.html" class="mobile-drawer-link" @click="mobileMenu = false" x-text="lang === 'ne' ? 'गृहपृष्ठ' : 'Home'"></a>
                <a href="about.html" class="mobile-drawer-link" @click="mobileMenu = false" x-text="lang === 'ne' ? 'परिचय' : 'About'"></a>
                <a href="projects.html" class="mobile-drawer-link" @click="mobileMenu = false" x-text="lang === 'ne' ? 'विकास आयोजना' : 'Projects'"></a>
                <a href="media.html" class="mobile-drawer-link" @click="mobileMenu = false" x-text="lang === 'ne' ? 'मिडिया तथा ग्यालरी' : 'Media & Gallery'"></a>
                <a href="constituency.html" class="mobile-drawer-link" @click="mobileMenu = false" x-text="lang === 'ne' ? 'क्षेत्र' : 'Constituency'"></a>
                <a href="contact.html" class="mobile-drawer-link" @click="mobileMenu = false" x-text="lang === 'ne' ? 'सम्पर्क' : 'Contact'"></a>
            </div>
        </div>
        <div class="mobile-drawer-footer">
            <a href="gunaso.html" class="btn btn-accent btn-block" @click="mobileMenu = false">
                <i class="fas fa-headset"></i>
                <span x-text="lang === 'ne' ? 'जनगुनासो पोर्टल (Citizen Service)' : 'Citizen Grievance Portal'"></span>
            </a>
            <div style="display: flex; gap: 0.5rem; justify-content: center;">
                <button class="lang-btn" :class="{ 'active': lang === 'ne' }" @click="setLanguage('ne')">नेपाली</button>
                <button class="lang-btn" :class="{ 'active': lang === 'en' }" @click="setLanguage('en')">English</button>
            </div>
        </div>
    </div>

    <!-- ======================================================================
         Main Page Content
         ====================================================================== -->
    <main>

        <!-- Hero Section -->
        <section class="hero-section" id="home">
            <div class="hero-bg-pattern"></div>
            <div class="hero-glow"></div>
            <div class="container hero-grid">
                <!-- Hero Left Content -->
                <div class="hero-content">
                    <div class="hero-badge-row">
                        <span class="hero-badge verified">
                            <i class="fas fa-check-circle"></i>
                            <span x-text="lang === 'ne' ? 'संसदीय आधिकारिक पोर्टल' : 'Official MP Portal'"></span>
                        </span>
                        <span class="hero-badge">
                            <i class="fas fa-landmark"></i>
                            <span x-text="lang === 'ne' ? 'प्रतिनिधि सभा' : 'House of Representatives'"></span>
                        </span>
                        <span class="hero-badge">
                            <i class="fas fa-map-marker-alt"></i>
                            <span x-text="lang === 'ne' ? profile.constituencyNe : profile.constituencyEn"></span>
                        </span>
                    </div>

                    <h1 class="hero-name" x-text="lang === 'ne' ? profile.nameNe : profile.nameEn"></h1>
                    <p class="hero-role" x-text="lang === 'ne' ? profile.roleNe : profile.roleEn"></p>
                    <p class="hero-tagline" x-text="lang === 'ne' ? '“' + profile.taglineNe + '”' : '“' + profile.taglineEn + '”'"></p>
                    <p class="hero-bio" x-text="lang === 'ne' ? profile.bioNe : profile.bioEn"></p>

                    <div class="hero-cta-group">
                        <a href="gunaso.html" class="btn btn-accent btn-lg">
                            <i class="fas fa-headset"></i>
                            <span x-text="lang === 'ne' ? 'जनगुनासो दर्ता गर्नुहोस्' : 'Citizen Grievance Portal'"></span>
                        </a>
                        <button class="btn btn-outline btn-lg" style="color: #ffffff; border-color: rgba(255,255,255,0.3);" @click="appointmentModal.isOpen = true">
                            <i class="fas fa-calendar-check"></i>
                            <span x-text="lang === 'ne' ? 'भेटघाट समय लिनुहोस्' : 'Request Appointment'"></span>
                        </button>
                        <a href="media.html" class="btn btn-outline btn-lg" style="color: #ffffff; border-color: rgba(255,255,255,0.3);">
                            <i class="fas fa-play-circle"></i>
                            <span x-text="lang === 'ne' ? 'संसदीय भाषणहरू' : 'Speeches in Parliament'"></span>
                        </a>
                    </div>
                </div>

                <!-- Hero Right Portrait -->
                <div class="hero-portrait-wrap">
                    <div class="hero-portrait-card">
                        <img :src="profile.photoUrl" :alt="profile.nameEn" class="hero-portrait-img" loading="eager"
                             onerror="this.src='https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=800&q=80'">
                        <a :href="profile.partyWebsite" target="_blank" rel="noopener" class="hero-portrait-badge" style="text-decoration: none;" title="Visit Nepali Congress Official Website">
                            <div class="hero-portrait-info">
                                <h4 x-text="lang === 'ne' ? profile.nameNe : profile.nameEn"></h4>
                                <p x-text="lang === 'ne' ? profile.partyNe + ' • ' + profile.constituencyNe : profile.partyEn + ' • ' + profile.constituencyEn"></p>
                            </div>
                            <img :src="profile.partyLogoUrl" alt="Party Emblem" class="hero-party-icon"
                                 onerror="this.style.display='none'">
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <!-- Stats Counter Bar -->
        <section class="stats-section">
            <div class="container stats-grid">
                <template x-for="stat in stats" :key="stat.id">
                    <div class="stat-card">
                        <div class="stat-icon-wrap">
                            <i class="fas" :class="stat.icon"></i>
                        </div>
                        <div>
                            <div class="stat-number">
                                <span x-text="stat.count"></span><span x-text="stat.suffix"></span>
                            </div>
                            <div class="stat-label" x-text="lang === 'ne' ? stat.labelNe : stat.labelEn"></div>
                        </div>
                    </div>
                </template>
            </div>
        </section>

        <!-- Quick Services -->
        <section class="services-bar-section">
            <div class="container services-grid">
                <a href="gunaso.html" class="service-card">
                    <div class="service-icon"><i class="fas fa-file-signature"></i></div>
                    <div>
                        <h4 class="service-title" x-text="lang === 'ne' ? 'जनगुनासो दर्ता' : 'Register Grievance'"></h4>
                        <p class="service-desc" x-text="lang === 'ne' ? 'सडक, खानेपानी, शिक्षा, स्वास्थ्य समस्या सिधै पठाउनुहोस्' : 'Submit civic issues directly to Secretariat'"></p>
                    </div>
                </a>

                <a href="gunaso.html#track" class="service-card">
                    <div class="service-icon"><i class="fas fa-search-location"></i></div>
                    <div>
                        <h4 class="service-title" x-text="lang === 'ne' ? 'गुनासो ट्र्याकिङ' : 'Track Status'"></h4>
                        <p class="service-desc" x-text="lang === 'ne' ? 'टिकट नम्बरबाट आफ्नो समस्याको पछिल्लो अवस्था हेर्नुहोस्' : 'Check real-time progress using Ticket ID'"></p>
                    </div>
                </a>

                <a href="projects.html" class="service-card">
                    <div class="service-icon"><i class="fas fa-chart-line"></i></div>
                    <div>
                        <h4 class="service-title" x-text="lang === 'ne' ? 'विकास आयोजना' : 'Projects Tracker'"></h4>
                        <p class="service-desc" x-text="lang === 'ne' ? 'इलाम–१ मा सञ्चालित बजेट र निर्माण कार्यको पारदर्शिता' : 'Transparent budget & progress monitoring'"></p>
                    </div>
                </a>

                <a href="media.html" class="service-card">
                    <div class="service-icon"><i class="fas fa-video"></i></div>
                    <div>
                        <h4 class="service-title" x-text="lang === 'ne' ? 'संसदीय भिडियो' : 'Parliament Videos'"></h4>
                        <p class="service-desc" x-text="lang === 'ne' ? 'सदन बैठक, सम्बोधन तथा टेलिभिजन अन्तरवार्ताहरू' : 'Speeches, zero hour debates & press clips'"></p>
                    </div>
                </a>
            </div>
        </section>

        <!-- Vision & Policy Pledge Section (Inspired by Gagan Thapa's Vision / Pratigya Patra) -->
        <section class="section" style="background: linear-gradient(180deg, var(--bg-surface) 0%, var(--bg-accent-subtle) 100%);">
            <div class="container">
                <div class="section-header">
                    <span class="section-tag">
                        <i class="fas fa-star" style="color: var(--accent-red); font-size: 0.75rem;"></i>
                        <span x-text="lang === 'ne' ? 'हाम्रो संकल्प र प्रतिज्ञा' : 'Our Policy Pledges & Vision'"></span>
                    </span>
                    <h2 class="section-title" x-text="lang === 'ne' ? 'समृद्ध इलाम र समुन्नत नेपालको खाका' : 'Blueprint for a Dignified, Prosperous Nepal'"></h2>
                    <p class="section-subtitle" x-text="lang === 'ne' ? 'नेपाली कांग्रेसको लोकतान्त्रिक मूल्य, स्पष्ट नीति र नतिजामुखी कार्ययोजना' : 'Democratic values, evidence-based legislation, and concrete delivery for all.'"></p>
                    
                    <!-- 4 Stars Divider -->
                    <div class="nc-stars-divider">
                        <div class="nc-star-line"></div>
                        <i class="fas fa-star nc-star"></i>
                        <i class="fas fa-star nc-star"></i>
                        <i class="fas fa-star nc-star"></i>
                        <i class="fas fa-star nc-star"></i>
                        <div class="nc-star-line"></div>
                    </div>
                </div>

                <div class="priorities-grid">
                    <template x-for="pledge in pledges" :key="pledge.id">
                        <div class="priority-card" style="border-top: 3px solid var(--nc-green);">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                                <div class="priority-icon-wrap emerald" style="margin-bottom: 0;">
                                    <i class="fas" :class="pledge.icon"></i>
                                </div>
                                <span style="font-family: var(--font-heading); font-size: 1.65rem; font-weight: 900; color: var(--nc-green); opacity: 0.85;" x-text="pledge.num"></span>
                            </div>
                            <h3 class="priority-title" x-text="lang === 'ne' ? pledge.titleNe : pledge.titleEn"></h3>
                            <p class="priority-desc" x-text="lang === 'ne' ? pledge.descNe : pledge.descEn"></p>
                        </div>
                    </template>
                </div>

                <!-- Pledge Document Download Banner (Inspired by Gagan Thapa's Pratigya-Patra) -->
                <div class="pledge-banner-section" style="border-radius: var(--radius-xl); margin-top: 3.5rem; padding: 2.5rem 3rem;">
                    <div class="pledge-banner-grid">
                        <div>
                            <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem;">
                                <span style="background: rgba(255,255,255,0.2); padding: 0.2rem 0.6rem; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 800; text-transform: uppercase;">
                                    <i class="fas fa-file-lines"></i> <span x-text="lang === 'ne' ? 'आधिकारिक दस्ताबेज' : 'Policy Manifesto'"></span>
                                </span>
                            </div>
                            <h3 class="pledge-banner-title" x-text="lang === 'ne' ? 'इलाम–१ विकास मार्गचित्र तथा प्रतिज्ञा पत्र २०८२+' : 'Ilam-1 Development Blueprint & Policy Pledge'"></h3>
                            <p class="pledge-banner-desc" x-text="lang === 'ne' ? 'चिया किसानको समृद्धि, सडक सञ्जालको स्तरोन्नति, गुणस्तरीय स्वास्थ्य बिमा र युवा उद्यमशीलताका नीतिगत प्रतिबद्धताहरू समेटिएको दस्तावेज।' : 'Comprehensive policy document outlining actionable roadmaps for agro-industrialization, universal healthcare, and STEM education.'"></p>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 1rem; justify-content: center; align-items: flex-start;">
                            <a href="https://nepalicongress.org/election2082/pratigya-patra" target="_blank" rel="noopener" class="btn btn-accent btn-lg" style="width: 100%;">
                                <i class="fas fa-file-arrow-down"></i>
                                <span x-text="lang === 'ne' ? 'प्रतिज्ञा पत्र अध्ययन गर्नुहोस्' : 'Download Policy Pledge'"></span>
                            </a>
                            <a href="https://nepalicongress.org" target="_blank" rel="noopener" class="btn btn-outline btn-lg" style="color: #ffffff; border-color: rgba(255,255,255,0.4); width: 100%;">
                                <i class="fas fa-tree"></i>
                                <span x-text="lang === 'ne' ? 'नेपाली कांग्रेस आधिकारिक पोर्टल' : 'Nepali Congress Official'"></span>
                                <i class="fas fa-arrow-up-right-from-square" style="font-size: 0.8rem; margin-left: 4px;"></i>
                            </a>
                        </div>
                    </div>
                </div>

            </div>
        </section>

        <!-- Inspired Team Building Quote Section (Building Nepal Together / Team Nepal) -->
        <section style="background: var(--bg-muted); padding: 4.5rem 0; border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); text-align: center;">
            <div class="container" style="max-width: 860px;">
                <!-- 4 Stars -->
                <div class="nc-stars-divider" style="margin-bottom: 1.5rem;">
                    <div class="nc-star-line"></div>
                    <i class="fas fa-star nc-star"></i>
                    <i class="fas fa-star nc-star"></i>
                    <i class="fas fa-star nc-star"></i>
                    <i class="fas fa-star nc-star"></i>
                    <div class="nc-star-line"></div>
                </div>

                <h2 style="font-family: var(--font-heading); font-size: 2.35rem; font-weight: 900; color: var(--primary); line-height: 1.25; margin-bottom: 1.25rem;"
                    x-text="lang === 'ne' 
                    ? '“विकास एक व्यक्तिको प्रयास होइन, यो सबैको साझा सहकार्य हो। हामी सबै मिलेर बन्नेछ टिम इलाम–१ र टिम नेपाल।”' 
                    : '“Building our nation is not the effort of a single person—it is a collective team endeavor. Together, we build Team Ilam and Team Nepal.”'">
                </h2>

                <p style="font-size: 1.15rem; color: var(--text-muted); line-height: 1.7; margin-bottom: 2rem;"
                   x-text="lang === 'ne' 
                    ? 'इलामका किसान, युवा, उद्यमी, आमा समूह र प्रत्येक सचेत नागरिकको साथमा हामी रूपान्तरणको नयाँ युगको थालनी गर्दैछौँ।'
                    : 'Uniting local tea growers, youth innovators, educators, and community grassroots to shape a modern, accountable future.'">
                </p>

                <div class="nc-stars-divider">
                    <div class="nc-star-line"></div>
                    <i class="fas fa-star nc-star"></i>
                    <i class="fas fa-star nc-star"></i>
                    <i class="fas fa-star nc-star"></i>
                    <i class="fas fa-star nc-star"></i>
                    <div class="nc-star-line"></div>
                </div>
            </div>
        </section>

        <!-- Brief Profile Section -->
        <section class="section" id="about">
            <div class="container">
                <div class="section-header">
                    <span class="section-tag" x-text="lang === 'ne' ? 'परिचय तथा दृष्टिकोण' : 'Leadership & Profile'"></span>

                        <p x-text="lang === 'ne' ? galleryModal.activeList[galleryModal.currentIndex].captionNe : galleryModal.activeList[galleryModal.currentIndex].captionEn"></p>
                    </div>
                    <div class="gallery-counter-pill" x-text="(galleryModal.currentIndex + 1) + ' / ' + galleryModal.activeList.length"></div>
                </div>
            </template>
        </div>
    </div>

    <div class="modal-backdrop" x-show="appointmentModal.isOpen" x-cloak style="display: none;" @click.self="appointmentModal.isOpen = false">
        <div class="modal-container" style="max-width: 580px;">
            <button class="modal-close-btn" @click="appointmentModal.isOpen = false"><i class="fas fa-times"></i></button>
            <div class="appointment-modal-body">
                <h3 class="appointment-modal-title" x-text="lang === 'ne' ? 'भेटघाट समय अनुरोध फारम' : 'Request MP Appointment'"></h3>
                <p class="appointment-modal-desc" x-text="lang === 'ne' ? 'सांसद तथा सचिवालयसँग भेटघाटका लागि विवरण भर्नुहोस्:' : 'Fill in the schedule request for official meetings:'"></p>
                <form @submit.prevent="submitAppointment()">
                    <div class="form-group">
                        <label class="form-label" x-text="lang === 'ne' ? 'पूरा नाम *' : 'Full Name *'"></label>
                        <input type="text" class="form-input" x-model="appointmentModal.name" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" x-text="lang === 'ne' ? 'मोबाइल नम्बर *' : 'Mobile Number *'"></label>
                        <input type="tel" class="form-input" x-model="appointmentModal.phone" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" x-text="lang === 'ne' ? 'भेटघाट स्थान' : 'Meeting Office'"></label>
                        <select class="form-select" x-model="appointmentModal.location">
                            <option value="Constituency Office (Ilam)">Constituency Office (इलाम सम्पर्क कार्यालय)</option>
                            <option value="Central Parliament (Kathmandu)">Central Parliament Office (काठमाडौँ)</option>
                            <option value="Virtual Video Meeting">Virtual / Video Call (अनलाइन संवाद)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" x-text="lang === 'ne' ? 'प्रस्तावित मिति' : 'Preferred Date'"></label>
                        <input type="date" class="form-input" x-model="appointmentModal.date" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" x-text="lang === 'ne' ? 'भेटघाटको मुख्य उद्देश्य *' : 'Purpose of Meeting *'"></label>
                        <textarea class="form-textarea" rows="3" x-model="appointmentModal.purpose" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        <i class="fas fa-calendar-check"></i>
                        <span x-text="lang === 'ne' ? 'अनुरोध पेस गर्नुहोस्' : 'Submit Appointment Request'"></span>
                    </button>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
