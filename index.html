<!DOCTYPE html>
<html lang="ne" x-data="parliamentApp" :class="{ 'dark': theme === 'dark' }">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title
        x-text="lang === 'ne' ? 'माननीय निश्कल राई — प्रतिनिधि सभा सदस्य, इलाम–१' : 'Hon. Nishcal Rai — Member of Parliament, Ilam-1, Nepal'">
        Hon. Nishcal Rai — Member of Parliament, Ilam-1
    </title>
    <meta name="description"
        content="Official website of Hon. Nishcal Rai, Member of the House of Representatives (Federal Parliament of Nepal), Ilam Constituency No. 1. Citizen services, parliamentary speeches, constituency development projects, and public grievance portal.">

    <!-- Google Fonts Preconnect & Stylesheets -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Mukta:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Core & Component Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">

    <!-- Structured Data & Application Scripts -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
</head>

<body :data-lang="lang">

    <!-- ======================================================================
         Top Civic Bar (Official Parliament Header)
         ====================================================================== -->
    <header class="civic-top-bar">
        <div class="container civic-top-inner">
            <!-- Left: Parliament Seal + MP Quick Info -->
            <a href="https://hr.parliament.gov.np" target="_blank" rel="noopener" class="civic-left"
                title="House of Representatives, Nepal">
                <img :src="profile.emblemUrl" alt="Emblem of Nepal" class="civic-emblem"
                    onerror="this.src='https://giwmscdntwo.gov.np/static/assets/image/Emblem_of_Nepal.png'">
                <div class="civic-institution">
                    <span class="civic-rep-title"
                        x-text="lang === 'ne' ? 'प्रतिनिधि सभा • संघीय संसद' : 'House of Representatives • Federal Parliament'"></span>
                    <span class="civic-mp-name" x-text="lang === 'ne' ? profile.nameNe : profile.nameEn"></span>
                    <span class="civic-constituency"
                        x-text="lang === 'ne' ? profile.constituencyNe : profile.constituencyEn"></span>
                </div>
            </a>

            <!-- Center: Dynamic News Ticker -->
            <div class="civic-ticker">
                <span class="ticker-label">
                    <i class="fas fa-bullhorn"></i>
                    <span x-text="lang === 'ne' ? 'ताजा समाचार' : 'Updates'"></span>
                </span>
                <div class="ticker-marquee">
                    <marquee scrollamount="4" onmouseover="this.stop()" onmouseout="this.start()">
                        <template x-for="(news, index) in tickerNews" :key="index">
                            <span>
                                <a href="media.html" class="ticker-item"
                                    x-text="lang === 'ne' ? news.titleNe : news.titleEn"></a>
                                <span style="margin: 0 12px; opacity: 0.5;">•</span>
                            </span>
                        </template>
                    </marquee>
                </div>
            </div>

            <!-- Right: Date, Language & Theme Controls -->
            <div class="civic-right">
                <div class="civic-date">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/9/9b/Flag_of_Nepal.svg" alt="Nepal Flag"
                        class="civic-flag">
                    <span x-text="lang === 'ne' ? currentDateNe : currentDateEn"></span>
                </div>
                <div class="civic-tools">
                    <button class="lang-btn" :class="{ 'active': lang === 'ne' }" @click="setLanguage('ne')"
                        title="नेपाली">ने</button>
                    <button class="lang-btn" :class="{ 'active': lang === 'en' }" @click="setLanguage('en')"
                        title="English">EN</button>
                    <button class="theme-toggle-btn" @click="toggleTheme()"
                        :title="theme === 'dark' ? 'Light Mode' : 'Dark Mode'">
                        <i class="fas" :class="theme === 'dark' ? 'fa-sun' : 'fa-moon'"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- ======================================================================
         Sticky Main Navigation
         ====================================================================== -->
    <nav class="main-nav" id="navbar">
        <div class="container nav-inner">
            <a href="index.html" class="nav-brand">
                <img src="https://giwmscdntwo.gov.np/static/assets/image/Emblem_of_Nepal.png" alt="Emblem"
                    style="width: 36px; height: 36px;">
                <div>
                    <span class="nav-brand-title" x-text="lang === 'ne' ? profile.nameNe : profile.nameEn"></span>
                    <span class="nav-brand-sub"
                        x-text="lang === 'ne' ? 'इलाम निर्वाचन क्षेत्र नं. १' : 'Ilam Constituency No. 1'"></span>
                </div>
            </a>

            <!-- Navigation Links -->
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link active" x-text="lang === 'ne' ? 'गृहपृष्ठ' : 'Home'"></a></li>
                <li><a href="about.html" class="nav-link" x-text="lang === 'ne' ? 'परिचय' : 'About'"></a></li>
                <li><a href="projects.html" class="nav-link" x-text="lang === 'ne' ? 'विकास आयोजना' : 'Projects'"></a>
                </li>
                <li><a href="media.html" class="nav-link"
                        x-text="lang === 'ne' ? 'मिडिया तथा ग्यालरी' : 'Media & Gallery'"></a></li>
                <li><a href="constituency.html" class="nav-link"
                        x-text="lang === 'ne' ? 'क्षेत्र' : 'Constituency'"></a></li>
                <li><a href="contact.html" class="nav-link" x-text="lang === 'ne' ? 'सम्पर्क' : 'Contact'"></a></li>
            </ul>

            <!-- Quick Action CTA -->
            <div class="nav-actions">
                <a href="gunaso.html" class="btn btn-accent btn-sm">
                    <i class="fas fa-headset"></i>
                    <span x-text="lang === 'ne' ? 'जनगुनासो पोर्टल' : 'Citizen Grievance'"></span>
                </a>
                <button class="mobile-toggle" @click="mobileMenu = !mobileMenu" aria-label="Toggle Mobile Menu">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Mobile Drawer -->
    <div class="mobile-drawer" x-show="mobileMenu" x-cloak style="display: none;">
        <div>
            <div class="mobile-drawer-header">
                <div>
                    <h3 style="font-weight: 800; color: var(--primary);"
                        x-text="lang === 'ne' ? profile.nameNe : profile.nameEn"></h3>
                    <p style="font-size: 0.8rem; color: var(--text-muted);"
                        x-text="lang === 'ne' ? profile.constituencyNe : profile.constituencyEn"></p>
                </div>
                <button class="modal-close-btn" style="position: static;" @click="mobileMenu = false">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="mobile-drawer-links">
                <a href="index.html" class="mobile-drawer-link" @click="mobileMenu = false"
                    x-text="lang === 'ne' ? 'गृहपृष्ठ' : 'Home'"></a>
                <a href="about.html" class="mobile-drawer-link" @click="mobileMenu = false"
                    x-text="lang === 'ne' ? 'परिचय' : 'About'"></a>
                <a href="projects.html" class="mobile-drawer-link" @click="mobileMenu = false"
                    x-text="lang === 'ne' ? 'विकास आयोजना' : 'Projects'"></a>
                <a href="media.html" class="mobile-drawer-link" @click="mobileMenu = false"
                    x-text="lang === 'ne' ? 'मिडिया तथा ग्यालरी' : 'Media & Gallery'"></a>
                <a href="constituency.html" class="mobile-drawer-link" @click="mobileMenu = false"
                    x-text="lang === 'ne' ? 'क्षेत्र' : 'Constituency'"></a>
                <a href="contact.html" class="mobile-drawer-link" @click="mobileMenu = false"
                    x-text="lang === 'ne' ? 'सम्पर्क' : 'Contact'"></a>
            </div>
        </div>
        <div class="mobile-drawer-footer">
            <a href="gunaso.html" class="btn btn-accent btn-block" @click="mobileMenu = false">
                <i class="fas fa-headset"></i>
                <span x-text="lang === 'ne' ? 'जनगुनासो पोर्टल (Citizen Service)' : 'Citizen Grievance Portal'"></span>
            </a>
            <div style="display: flex; gap: 0.5rem; justify-content: center;">
                <button class="lang-btn" :class="{ 'active': lang === 'ne' }" @click="setLanguage('ne')">नेपाली</button>
                <button class="lang-btn" :class="{ 'active': lang === 'en' }"
                    @click="setLanguage('en')">English</button>
            </div>
        </div>
    </div>

    <!-- ======================================================================
         Main Page Content
         ====================================================================== -->
    <main>

        <!-- Presidential Hero Section -->
        <section class="hero-section" id="home">
            <!-- Ambient dot pattern -->
            <div class="hero-bg-pattern"></div>

            <!-- Cinematic Full-Bleed Portrait (right side, absolutely placed) -->
            <img :src="profile.photoUrl" :alt="profile.nameEn" class="hero-cinematic-portrait" loading="eager"
                onerror="this.src='https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=1200&q=85'">

            <!-- Gradient Mask: keeps left text crisp, portrait blends to the right -->
            <div class="hero-portrait-mask"></div>
            <div class="hero-bottom-vignette"></div>

            <!-- Content (left) -->
            <div class="hero-grid">
                <div class="hero-content">
                    <!-- Authority Strip -->
                    <div class="hero-authority-strip">
                        <span class="hero-authority-tag">
                            <i class="fas fa-certificate" style="color: #fbbf24;"></i>
                            <span x-text="lang === 'ne' ? 'संसदीय आधिकारिक पोर्टल' : 'Official MP Portal'"></span>
                        </span>
                        <span class="hero-authority-tag"
                            style="border-color: rgba(0, 92, 55, 0.4); background: rgba(0, 92, 55, 0.2);">
                            <i class="fas fa-landmark"></i>
                            <span
                                x-text="lang === 'ne' ? 'प्रतिनिधि सभा • इलाम–१' : 'House of Representatives • Ilam-1'"></span>
                        </span>
                    </div>

                    <!-- Monumental Name -->
                    <h1 class="hero-name-grand" x-text="lang === 'ne' ? profile.nameNe : profile.nameEn"></h1>

                    <div class="hero-designation">
                        <i class="fas fa-user-tie" style="color: #fbbf24; font-size: 1.15rem;"></i>
                        <span
                            x-text="lang === 'ne' ? 'माननीय सांसद • प्रतिनिधि सभा, नेपाल' : 'Member of Parliament • House of Representatives, Nepal'"></span>
                    </div>

                    <!-- Manifesto Quote -->
                    <p class="hero-manifesto-lead" x-text="lang === 'ne' ? profile.manifestoNe : profile.manifestoEn"></p>

                    <!-- Legislative Agenda Pills -->
                    <div class="hero-agenda-row">
                        <a href="projects.html" class="hero-agenda-pill">
                            <i class="fas fa-leaf" style="color: #4ade80;"></i>
                            <span x-text="lang === 'ne' ? 'अर्थोडक्स चिया रूपान्तरण' : 'Orthodox Tea Economy'"></span>
                        </a>
                        <a href="projects.html" class="hero-agenda-pill">
                            <i class="fas fa-heart-pulse" style="color: #f87171;"></i>
                            <span x-text="lang === 'ne' ? 'सुलभ स्वास्थ्य बिमा' : 'Universal Healthcare'"></span>
                        </a>
                        <a href="projects.html" class="hero-agenda-pill">
                            <i class="fas fa-road" style="color: #60a5fa;"></i>
                            <span x-text="lang === 'ne' ? 'सन्दकपुर पर्यटन कोरिडोर' : 'Tourism Corridors'"></span>
                        </a>
                        <a href="projects.html" class="hero-agenda-pill">
                            <i class="fas fa-laptop-code" style="color: #facc15;"></i>
                            <span x-text="lang === 'ne' ? 'युवा नवप्रवर्तन हब' : 'Youth Innovation'"></span>
                        </a>
                    </div>

                    <!-- Primary CTAs -->
                    <div class="hero-cta-suite">
                        <a href="gunaso.html" class="btn btn-accent btn-lg">
                            <i class="fas fa-headset"></i>
                            <span
                                x-text="lang === 'ne' ? 'जनगुनासो दर्ता गर्नुहोस्' : 'Citizen Grievance Portal'"></span>
                        </a>
                        <a href="media.html" class="btn btn-outline btn-lg"
                            style="color: #ffffff; border-color: rgba(255,255,255,0.35);">
                            <i class="fas fa-play-circle" style="color: #60a5fa;"></i>
                            <span x-text="lang === 'ne' ? 'संसदीय सम्बोधन' : 'Parliamentary Speeches'"></span>
                        </a>
                        <button class="btn btn-outline btn-lg"
                            style="color: #ffffff; border-color: rgba(255,255,255,0.35);"
                            @click="appointmentModal.isOpen = true">
                            <i class="fas fa-calendar-check" style="color: #4ade80;"></i>
                            <span x-text="lang === 'ne' ? 'भेटघाट अनुरोध' : 'Request Meeting'"></span>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Architectural Stats Counter Strip (Unboxed) -->
        <section class="container" style="position: relative; z-index: 10;">
            <div class="editorial-counter-strip">
                <div class="editorial-counter-grid">
                    <template x-for="stat in stats" :key="stat.id">
                        <div class="editorial-counter-col">
                            <div class="editorial-action-icon"
                                style="background: var(--bg-parliament-subtle); color: var(--parliament-blue);">
                                <i class="fas" :class="stat.icon"></i>
                            </div>
                            <div>
                                <div class="editorial-counter-num">
                                    <span x-text="stat.count"></span><span x-text="stat.suffix"
                                        style="color: var(--accent-red);"></span>
                                </div>
                                <div class="editorial-counter-label"
                                    x-text="lang === 'ne' ? stat.labelNe : stat.labelEn"></div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </section>

        <!-- Citizen Quick Action Directory (Unboxed) -->
        <section class="container">
            <div class="editorial-action-hub">
                <a href="gunaso.html" class="editorial-action-item">
                    <div class="editorial-action-icon"><i class="fas fa-file-signature"></i></div>
                    <div>
                        <div class="editorial-action-title"
                            x-text="lang === 'ne' ? 'जनगुनासो दर्ता' : 'Register Grievance'"></div>
                        <div class="editorial-action-sub"
                            x-text="lang === 'ne' ? 'सडक, खानेपानी, समस्या पठाउनुहोस्' : 'Submit civic issues directly'">
                        </div>
                    </div>
                </a>

                <a href="gunaso.html#track" class="editorial-action-item">
                    <div class="editorial-action-icon"><i class="fas fa-search-location"></i></div>
                    <div>
                        <div class="editorial-action-title"
                            x-text="lang === 'ne' ? 'गुनासो ट्र्याकिङ' : 'Track Status'"></div>
                        <div class="editorial-action-sub"
                            x-text="lang === 'ne' ? 'टिकट नम्बरबाट पछिल्लो अवस्था' : 'Live status tracking'"></div>
                    </div>
                </a>

                <a href="projects.html" class="editorial-action-item">
                    <div class="editorial-action-icon"><i class="fas fa-chart-line"></i></div>
                    <div>
                        <div class="editorial-action-title"
                            x-text="lang === 'ne' ? 'विकास आयोजना' : 'Projects Dossier'"></div>
                        <div class="editorial-action-sub"
                            x-text="lang === 'ne' ? 'बजेट र निर्माण कार्यको पारदर्शिता' : 'Transparent monitoring'">
                        </div>
                    </div>
                </a>

                <a href="media.html" class="editorial-action-item">
                    <div class="editorial-action-icon"><i class="fas fa-video"></i></div>
                    <div>
                        <div class="editorial-action-title"
                            x-text="lang === 'ne' ? 'संसदीय भिडियो' : 'Parliament Archive'"></div>
                        <div class="editorial-action-sub"
                            x-text="lang === 'ne' ? 'सदन बैठक र नीतिगत बहस' : 'Speeches & zero hour debates'"></div>
                    </div>
                </a>
            </div>
        </section>

        <!-- Vision & Policy Ledger Section (Unboxed Architectural List) -->
        <section class="section"
            style="background: var(--bg-surface); border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color);">
            <div class="container">
                <div class="section-header">
                    <span class="section-tag">
                        <i class="fas fa-star" style="color: var(--accent-red); font-size: 0.75rem;"></i>
                        <span
                            x-text="lang === 'ne' ? 'हाम्रो संकल्प र प्रतिज्ञा' : 'Policy Vision & Legislative Pledges'"></span>
                    </span>
                    <h2 class="section-title"
                        x-text="lang === 'ne' ? 'समृद्ध इलाम र समुन्नत नेपालको खाका' : 'Blueprint for Regional Transformation'">
                    </h2>
                    <p class="section-subtitle"
                        x-text="lang === 'ne' ? 'नेपाली कांग्रेसको लोकतान्त्रिक मूल्य, स्पष्ट नीति र नतिजामुखी कार्ययोजना' : 'Democratic values, evidence-based legislation, and concrete public delivery.'">
                    </p>

                    <!-- 4 Stars Divider -->
                    <div class="nc-stars-divider">
                        <div class="nc-star-line"></div>
                        <i class="fas fa-star nc-star"></i>
                        <i class="fas fa-star nc-star"></i>
                        <i class="fas fa-star nc-star"></i>
                        <i class="fas fa-star nc-star"></i>
                        <div class="nc-star-line"></div>
                    </div>
                </div>

                <!-- Unboxed Architectural Ledger -->
                <div class="editorial-ledger-container">
                    <template x-for="pledge in pledges" :key="pledge.id">
                        <div class="editorial-ledger-row">
                            <div class="editorial-ledger-num" x-text="pledge.num"></div>
                            <div>
                                <h3 class="editorial-ledger-title"
                                    x-text="lang === 'ne' ? pledge.titleNe : pledge.titleEn"></h3>
                            </div>
                            <div>
                                <p class="editorial-ledger-desc" x-text="lang === 'ne' ? pledge.descNe : pledge.descEn">
                                </p>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Policy Manifesto Download Strip -->
                <div class="pledge-banner-section"
                    style="border-radius: var(--radius-2xl); margin-top: 4rem; padding: 2.5rem 3rem;">
                    <div class="pledge-banner-grid">
                        <div>
                            <span
                                style="background: rgba(255,255,255,0.2); padding: 0.2rem 0.6rem; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 800; text-transform: uppercase;">
                                <i class="fas fa-file-lines"></i> <span
                                    x-text="lang === 'ne' ? 'आधिकारिक दस्ताबेज' : 'Policy Manifesto'"></span>
                            </span>
                            <h3 class="pledge-banner-title" style="margin-top: 0.75rem;"
                                x-text="lang === 'ne' ? 'इलाम–१ विकास मार्गचित्र तथा प्रतिज्ञा पत्र २०८२+' : 'Ilam-1 Development Blueprint & Policy Pledge'">
                            </h3>
                            <p class="pledge-banner-desc"
                                x-text="lang === 'ne' ? 'चिया किसानको समृद्धि, सडक सञ्जालको स्तरोन्नति, गुणस्तरीय स्वास्थ्य बिमा र युवा उद्यमशीलताका नीतिगत प्रतिबद्धताहरू समेटिएको दस्तावेज।' : 'Comprehensive policy document outlining actionable roadmaps for agro-industrialization, universal healthcare, and STEM education.'">
                            </p>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 1rem; justify-content: center;">
                            <a href="https://nepalicongress.org/election2082/pratigya-patra" target="_blank"
                                rel="noopener" class="btn btn-accent btn-lg" style="width: 100%;">
                                <i class="fas fa-file-arrow-down"></i>
                                <span
                                    x-text="lang === 'ne' ? 'प्रतिज्ञा पत्र अध्ययन गर्नुहोस्' : 'Download Policy Pledge'"></span>
                            </a>
                            <a href="https://nepalicongress.org" target="_blank" rel="noopener"
                                class="btn btn-outline btn-lg"
                                style="color: #ffffff; border-color: rgba(255,255,255,0.4); width: 100%;">
                                <i class="fas fa-tree"></i>
                                <span
                                    x-text="lang === 'ne' ? 'नेपाली कांग्रेस आधिकारिक पोर्टल' : 'Nepali Congress Official'"></span>
                                <i class="fas fa-arrow-up-right-from-square"
                                    style="font-size: 0.8rem; margin-left: 4px;"></i>
                            </a>
                        </div>
                    </div>
                </div>

            </div>
        </section>

        <!-- Brief Profile Section -->
        <section class="section" id="about">
            <div class="container">
                <div class="section-header">
                    <span class="section-tag"
                        x-text="lang === 'ne' ? 'परिचय तथा दृष्टिकोण' : 'Leadership & Profile'"></span>
                    <h2 class="section-title"
                        x-text="lang === 'ne' ? 'जनप्रतिनिधि परिचय' : 'About the Member of Parliament'"></h2>
                    <p class="section-subtitle"
                        x-text="lang === 'ne' ? 'इलाम–१ को सम्भावनालाई अवसरमा बदल्ने प्रतिबद्धता' : 'Championing Regional Prosperity, Democratic Values & Transparent Governance'">
                    </p>
                    <div class="section-divider"></div>
                </div>

                <div class="about-grid">
                    <div class="about-portrait-frame">
                        <img :src="profile.photoUrl" :alt="profile.nameEn" class="about-portrait-img">
                    </div>
                    <div class="about-text-content">
                        <h3 style="font-family: var(--font-heading); font-size: 2rem; font-weight: 900; color: var(--parliament-blue); margin-bottom: 1rem;"

                            class="fas fa-location-dot"></i> <span x-text="profile.centralOffice"></span></p>
                    <p style="font-size: 0.85rem; color: #cbd5e1; margin-bottom: 0.5rem;"><i class="fas fa-phone"></i>
                        <span x-text="profile.phone"></span>
                    </p>
                    <p style="font-size: 0.85rem; color: #cbd5e1; margin-bottom: 0.5rem;"><i
                            class="fas fa-envelope"></i> <span x-text="profile.email"></span></p>
                    <p style="font-size: 0.85rem; color: #fbbf24;"><i class="fas fa-clock"></i> <span
                            x-text="lang === 'ne' ? profile.officeHoursNe : profile.officeHoursEn"></span></p>
                </div>
            </div>

            <!-- Footer Bottom Bar -->
            <div class="footer-bottom">
                <div>
                    <span
                        x-text="'© 2026 ' + (lang === 'ne' ? profile.nameNe : profile.nameEn) + ' — ' + (lang === 'ne' ? 'प्रतिनिधि सभा सदस्य, इलाम–१। सर्वाधिकार सुरक्षित।' : 'Member of Parliament, Ilam-1. All rights reserved.')"></span>
                </div>
                <div>
                    <span
                        x-text="lang === 'ne' ? 'पारदर्शिता, जनउत्तरदायित्व र लोकतान्त्रिक मूल्यमा आधारित' : 'Committed to Transparency, Good Governance & Public Service'"></span>
                </div>
            </div>
        </div>
    </footer>

    <!-- Video & Appointment Modals -->
    <div class="modal-backdrop" x-show="videoModal.isOpen" x-cloak style="display: none;"
        @click.self="closeVideoModal()">
        <div class="modal-container video-modal-container">
            <button class="modal-close-btn" @click="closeVideoModal()"><i class="fas fa-times"></i></button>
            <div class="video-frame-wrap">
                <template x-if="videoModal.isOpen">
                    <iframe :src="'https://www.youtube-nocookie.com/embed/' + videoModal.youtubeId + '?autoplay=1'"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen></iframe>
                </template>
            </div>
            <div class="video-modal-info">
                <span class="video-modal-category" x-text="videoModal.category"></span>
                <h3 class="video-modal-title" x-text="videoModal.title"></h3>
            </div>
        </div>
    </div>

    <div class="modal-backdrop" x-show="galleryModal.isOpen" x-cloak style="display: none;"
        @click.self="closeGalleryModal()">
        <div class="gallery-modal-container">
            <button class="modal-close-btn" @click="closeGalleryModal()"><i class="fas fa-times"></i></button>
            <div class="gallery-modal-stage">
                <button class="gallery-nav-btn prev" @click="prevGalleryImage()" aria-label="Previous"><i
                        class="fas fa-chevron-left"></i></button>
                <template x-if="galleryModal.activeList.length > 0">
                    <img :src="galleryModal.activeList[galleryModal.currentIndex].image"
                        :alt="galleryModal.activeList[galleryModal.currentIndex].titleEn" class="gallery-modal-img">
                </template>
                <button class="gallery-nav-btn next" @click="nextGalleryImage()" aria-label="Next"><i
                        class="fas fa-chevron-right"></i></button>
            </div>
            <template x-if="galleryModal.activeList.length > 0">
                <div class="gallery-modal-caption-box">
                    <div class="gallery-caption-text">
                        <h4
                            x-text="lang === 'ne' ? galleryModal.activeList[galleryModal.currentIndex].titleNe : galleryModal.activeList[galleryModal.currentIndex].titleEn">
                        </h4>
                        <p
                            x-text="lang === 'ne' ? galleryModal.activeList[galleryModal.currentIndex].captionNe : galleryModal.activeList[galleryModal.currentIndex].captionEn">
                        </p>
                    </div>
                    <div class="gallery-counter-pill"
                        x-text="(galleryModal.currentIndex + 1) + ' / ' + galleryModal.activeList.length"></div>
                </div>
            </template>
        </div>
    </div>

    <div class="modal-backdrop" x-show="appointmentModal.isOpen" x-cloak style="display: none;"
        @click.self="appointmentModal.isOpen = false">
        <div class="modal-container" style="max-width: 580px;">
            <button class="modal-close-btn" @click="appointmentModal.isOpen = false"><i
                    class="fas fa-times"></i></button>
            <div class="appointment-modal-body">
                <h3 class="appointment-modal-title"
                    x-text="lang === 'ne' ? 'भेटघाट समय अनुरोध फारम' : 'Request MP Appointment'"></h3>
                <p class="appointment-modal-desc"
                    x-text="lang === 'ne' ? 'सांसद तथा सचिवालयसँग भेटघाटका लागि विवरण भर्नुहोस्:' : 'Fill in the schedule request for official meetings:'">
                </p>
                <form @submit.prevent="submitAppointment()">
                    <div class="form-group">
                        <label class="form-label" x-text="lang === 'ne' ? 'पूरा नाम *' : 'Full Name *'"></label>
                        <input type="text" class="form-input" x-model="appointmentModal.name" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" x-text="lang === 'ne' ? 'मोबाइल नम्बर *' : 'Mobile Number *'"></label>
                        <input type="tel" class="form-input" x-model="appointmentModal.phone" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" x-text="lang === 'ne' ? 'भेटघाट स्थान' : 'Meeting Office'"></label>
                        <select class="form-select" x-model="appointmentModal.location">
                            <option value="Constituency Office (Ilam)">Constituency Office (इलाम सम्पर्क कार्यालय)
                            </option>
                            <option value="Central Parliament (Kathmandu)">Central Parliament Office (काठमाडौँ)</option>
                            <option value="Virtual Video Meeting">Virtual / Video Call (अनलाइन संवाद)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" x-text="lang === 'ne' ? 'प्रस्तावित मिति' : 'Preferred Date'"></label>
                        <input type="date" class="form-input" x-model="appointmentModal.date" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label"
                            x-text="lang === 'ne' ? 'भेटघाटको मुख्य उद्देश्य *' : 'Purpose of Meeting *'"></label>
                        <textarea class="form-textarea" rows="3" x-model="appointmentModal.purpose" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        <i class="fas fa-calendar-check"></i>
                        <span x-text="lang === 'ne' ? 'अनुरोध पेस गर्नुहोस्' : 'Submit Appointment Request'"></span>
                    </button>
                </form>
            </div>
        </div>
    </div>

</body>

</html>
