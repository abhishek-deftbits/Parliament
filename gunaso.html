<!DOCTYPE html>
<html lang="ne" x-data="parliamentApp" :class="{ 'dark': theme === 'dark' }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title x-text="lang === 'ne' ? 'अनलाइन जनगुनासो तथा नागरिक सेवा पोर्टल — इलाम–१' : 'Citizen Grievance & Service Portal — Ilam-1, Nepal'">
        Citizen Grievance & Service Portal — Ilam-1
    </title>
    <meta name="description" content="Online public grievance submission and real-time status tracking directly with Hon. Nishcal Rai's Parliamentary Secretariat.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Mukta:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
</head>
<body :data-lang="lang">

    <!-- Civic Top Bar -->
    <header class="civic-top-bar">
        <div class="container civic-top-inner">
            <a href="https://hr.parliament.gov.np" target="_blank" rel="noopener" class="civic-left">
                <img :src="profile.emblemUrl" alt="Emblem" class="civic-emblem" onerror="this.src='https://giwmscdntwo.gov.np/static/assets/image/Emblem_of_Nepal.png'">
                <div class="civic-institution">
                    <span class="civic-rep-title" x-text="lang === 'ne' ? 'प्रतिनिधि सभा • संघीय संसद' : 'House of Representatives • Federal Parliament'"></span>
                    <span class="civic-mp-name" x-text="lang === 'ne' ? profile.nameNe : profile.nameEn"></span>
                    <span class="civic-constituency" x-text="lang === 'ne' ? profile.constituencyNe : profile.constituencyEn"></span>
                </div>
            </a>
            <div class="civic-ticker">
                <span class="ticker-label"><i class="fas fa-bullhorn"></i> <span x-text="lang === 'ne' ? 'ताजा समाचार' : 'Updates'"></span></span>
                <div class="ticker-marquee">
                    <marquee scrollamount="4" onmouseover="this.stop()" onmouseout="this.start()">
                        <template x-for="(news, index) in tickerNews" :key="index">
                            <span>
                                <a href="media.html" class="ticker-item" x-text="lang === 'ne' ? news.titleNe : news.titleEn"></a>
                                <span style="margin: 0 12px; opacity: 0.5;">•</span>
                            </span>
                        </template>
                    </marquee>
                </div>
            </div>
            <div class="civic-right">
                <div class="civic-date">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/9/9b/Flag_of_Nepal.svg" alt="Nepal Flag" class="civic-flag">
                    <span x-text="lang === 'ne' ? currentDateNe : currentDateEn"></span>
                </div>
                <div class="civic-tools">
                    <button class="lang-btn" :class="{ 'active': lang === 'ne' }" @click="setLanguage('ne')">ने</button>
                    <button class="lang-btn" :class="{ 'active': lang === 'en' }" @click="setLanguage('en')">EN</button>
                    <button class="theme-toggle-btn" @click="toggleTheme()">
                        <i class="fas" :class="theme === 'dark' ? 'fa-sun' : 'fa-moon'"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="main-nav" id="navbar">
        <div class="container nav-inner">
            <a href="index.html" class="nav-brand">
                <img src="https://giwmscdntwo.gov.np/static/assets/image/Emblem_of_Nepal.png" alt="Emblem" style="width: 36px; height: 36px;">
                <div>
                    <span class="nav-brand-title" x-text="lang === 'ne' ? profile.nameNe : profile.nameEn"></span>
                    <span class="nav-brand-sub" x-text="lang === 'ne' ? 'इलाम निर्वाचन क्षेत्र नं. १' : 'Ilam Constituency No. 1'"></span>
                </div>
            </a>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link" x-text="lang === 'ne' ? 'गृहपृष्ठ' : 'Home'"></a></li>
                <li><a href="about.html" class="nav-link" x-text="lang === 'ne' ? 'परिचय' : 'About'"></a></li>
                <li><a href="projects.html" class="nav-link" x-text="lang === 'ne' ? 'विकास आयोजना' : 'Projects'"></a></li>
                <li><a href="media.html" class="nav-link" x-text="lang === 'ne' ? 'मिडिया तथा ग्यालरी' : 'Media & Gallery'"></a></li>
                <li><a href="constituency.html" class="nav-link" x-text="lang === 'ne' ? 'क्षेत्र' : 'Constituency'"></a></li>
                <li><a href="contact.html" class="nav-link" x-text="lang === 'ne' ? 'सम्पर्क' : 'Contact'"></a></li>
            </ul>
            <div class="nav-actions">
                <a href="gunaso.html" class="btn btn-accent btn-sm">
                    <i class="fas fa-headset"></i>
                    <span x-text="lang === 'ne' ? 'जनगुनासो पोर्टल' : 'Citizen Grievance'"></span>
                </a>
                <button class="mobile-toggle" @click="mobileMenu = !mobileMenu"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </nav>

    <!-- Mobile Drawer -->
    <div class="mobile-drawer" x-show="mobileMenu" x-cloak style="display: none;">
        <div class="mobile-drawer-header">
            <div>
                <h3 style="font-weight: 800; color: var(--primary);" x-text="lang === 'ne' ? profile.nameNe : profile.nameEn"></h3>
                <p style="font-size: 0.8rem; color: var(--text-muted);" x-text="lang === 'ne' ? profile.constituencyNe : profile.constituencyEn"></p>
            </div>
            <button class="modal-close-btn" style="position: static;" @click="mobileMenu = false"><i class="fas fa-times"></i></button>
        </div>
        <div class="mobile-drawer-links">
            <a href="index.html" class="mobile-drawer-link" @click="mobileMenu = false" x-text="lang === 'ne' ? 'गृहपृष्ठ' : 'Home'"></a>
            <a href="about.html" class="mobile-drawer-link" @click="mobileMenu = false" x-text="lang === 'ne' ? 'परिचय' : 'About'"></a>
            <a href="projects.html" class="mobile-drawer-link" @click="mobileMenu = false" x-text="lang === 'ne' ? 'विकास आयोजना' : 'Projects'"></a>
            <a href="media.html" class="mobile-drawer-link" @click="mobileMenu = false" x-text="lang === 'ne' ? 'मिडिया तथा ग्यालरी' : 'Media & Gallery'"></a>
            <a href="constituency.html" class="mobile-drawer-link" @click="mobileMenu = false" x-text="lang === 'ne' ? 'क्षेत्र' : 'Constituency'"></a>
            <a href="contact.html" class="mobile-drawer-link" @click="mobileMenu = false" x-text="lang === 'ne' ? 'सम्पर्क' : 'Contact'"></a>
        </div>
    </div>

    <!-- Banner Header with Animation -->
    <section class="page-banner">
        <div class="container">
            <span class="section-tag page-banner-tag" style="background: rgba(255,255,255,0.12); color: #fbbf24; border-color: rgba(255,255,255,0.2);"
                  x-text="lang === 'ne' ? 'नागरिक सेवा तथा सुनुवाइ' : 'Citizen Service & Grievance'"></span>
            <h1 class="page-banner-title"
                x-text="lang === 'ne' ? 'अनलाइन जनगुनासो पोर्टल' : 'Citizen Grievance & Service Portal'"></h1>
            <p class="page-banner-desc"
               x-text="lang === 'ne' ? 'आफ्ना गाउँ-टोलका सडक, खानेपानी, शिक्षा, स्वास्थ्य वा प्रशासनिक समस्या दर्ता गर्नुहोस् र अवस्था ट्र्याक गर्नुहोस्।' : 'Submit local concerns directly to the Parliamentary Secretariat and track resolution in real time.'"></p>
            
            <!-- 4 Stars Divider -->
            <div class="nc-stars-divider">
                <div class="nc-star-line"></div>
                <i class="fas fa-star nc-star"></i>
                <i class="fas fa-star nc-star"></i>
                <i class="fas fa-star nc-star"></i>
                <i class="fas fa-star nc-star"></i>
                <div class="nc-star-line"></div>
            </div>
        </div>
    </section>

    <!-- Grievance Hub Section -->
    <section class="section">
        <div class="container">
            <div class="gunaso-wrapper animate-fade-in-up">
                <div class="gunaso-grid">
                    
                    <!-- Left: Submission Form -->
                    <div>
                        <template x-if="!gunaso.submitted">
                            <div>
                                <h3 class="gunaso-form-title" x-text="lang === 'ne' ? 'नयाँ जनगुनासो दर्ता गर्नुहोस्' : 'Submit a Public Concern / Issue'"></h3>
                                <p class="gunaso-form-desc" x-text="lang === 'ne' ? 'सडक, बिजुली, खानेपानी, स्वास्थ्य वा प्रशासनिक समस्या यहाँ लेख्नुहोस्।' : 'Fill out the form below. A tracking ticket ID will be generated immediately.'"></p>

                                <form @submit.prevent="submitGunasoForm()">
                                    <div class="form-grid-2">
                                        <div class="form-group">
                                            <label class="form-label" x-text="lang === 'ne' ? 'तपाईंको पूरा नाम *' : 'Full Name *'"></label>
                                            <input type="text" class="form-input" x-model="gunaso.form.name" required
                                                   :placeholder="lang === 'ne' ? 'उदा: राम बहादुर राई' : 'e.g. Ram Bahadur Rai'">
                                        </div>
                                        <div class="form-group">
                                            <label class="form-label" x-text="lang === 'ne' ? 'मोबाइल नम्बर *' : 'Mobile Phone *'"></label>
                                            <input type="tel" class="form-input" x-model="gunaso.form.phone" required
                                                   :placeholder="lang === 'ne' ? '९८XXXXXXXX' : '98XXXXXXXX'">
                                        </div>
                                    </div>

                                    <div class="form-grid-2">
                                        <div class="form-group">
                                            <label class="form-label" x-text="lang === 'ne' ? 'स्थानीय तह / पालिका *' : 'Municipality / Rural Mun. *'"></label>
                                            <select class="form-select" x-model="gunaso.form.municipality">
                                                <option value="Ilam Municipality">Ilam Municipality (इलाम नगरपालिका)</option>
                                                <option value="Suryodaya Municipality">Suryodaya Municipality (सूर्योदय नगरपालिका)</option>
                                                <option value="Mai Municipality">Mai Municipality (माई नगरपालिका)</option>
                                                <option value="Sandakpur Rural Municipality">Sandakpur Rural Mun. (सन्दकपुर गाउँपालिका)</option>
                                                <option value="Maijogmai Rural Municipality">Maijogmai Rural Mun. (माइजोगमाई गाउँपालिका)</option>
                                                <option value="Rong Rural Municipality">Rong Rural Mun. (रोङ गाउँपालिका)</option>
                                            </select>
                                        </div>
                                        <div class="form-group">
                                            <label class="form-label" x-text="lang === 'ne' ? 'वडा नम्बर' : 'Ward Number'"></label>
                                            <input type="text" class="form-input" x-model="gunaso.form.ward" placeholder="1 - 14">
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label class="form-label" x-text="lang === 'ne' ? 'गुनासोको विषय / क्षेत्र *' : 'Issue Category *'"></label>
                                        <select class="form-select" x-model="gunaso.form.category">
                                            <option value="Infrastructure & Roads">Infrastructure & Roads (सडक, पुल तथा यातायात)</option>
                                            <option value="Drinking Water & Electricity">Drinking Water & Electricity (खानेपानी तथा विद्युत)</option>
                                            <option value="Agriculture & Tea Farming">Agriculture & Tea Farming (कृषि, चिया तथा मलखाद)</option>
                                            <option value="Health & Hospital Services">Health & Hospital Services (स्वास्थ्य तथा अस्पताल)</option>
                                            <option value="Education & School Facilities">Education & Schools (शिक्षा तथा विद्यालय)</option>
                                            <option value="Administrative Governance">Administrative Governance (प्रशासनिक तथा अन्य)</option>
                                        </select>
                                    </div>

                                    <div class="form-group">
                                        <label class="form-label" x-text="lang === 'ne' ? 'गुनासोको विस्तृत विवरण *' : 'Detailed Description *'"></label>
                                        <textarea class="form-textarea" rows="4" x-model="gunaso.form.description" required
                                                  :placeholder="lang === 'ne' ? 'समस्याको स्थान, असर र आवश्यक सहयोगको विवरण लेख्नुहोस्...' : 'Describe the exact location, context and resolution needed...'"></textarea>
                                    </div>

                                    <div class="form-group">
                                        <label class="checkbox-group">
                                            <input type="checkbox" x-model="gunaso.form.isUrgent">
                                            <span x-text="lang === 'ne' ? 'यो आकस्मिक / तत्काल ध्यानाकर्षण आवश्यक विषय हो' : 'Mark as High Priority / Urgent Case'"></span>
                                        </label>
                                    </div>

                                    <button type="submit" class="btn btn-accent btn-lg" style="width: 100%;">
                                        <i class="fas fa-paper-plane"></i>
                                        <span x-text="lang === 'ne' ? 'जनगुनासो दर्ता गर्नुहोस्' : 'Submit Grievance Ticket'"></span>
                                    </button>
                                </form>
                            </div>
                        </template>

                        <!-- Success Card -->
                        <template x-if="gunaso.submitted">
                            <div class="alert-success-box">
                                <div class="alert-success-icon"><i class="fas fa-circle-check"></i></div>
                                <h3 style="font-family: var(--font-heading); font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem;"
                                    x-text="lang === 'ne' ? 'जनगुनासो सफलतापूर्वक दर्ता भयो!' : 'Grievance Successfully Registered!'"></h3>
                                <p style="color: var(--text-muted); font-size: 0.9rem;"
                                   x-text="lang === 'ne' ? 'तपाईंको गुनासो सांसद सचिवालय तथा सम्बन्धित शाखामा पठाइएको छ। कृपया आफ्नो टिकट नम्बर सुरक्षित राख्नुहोस्:' : 'Your concern has been forwarded to the Secretariat. Please keep your Ticket ID for tracking:'"></p>
                                
                                <div class="ticket-display-badge" x-text="gunaso.ticketId"></div>

                                <div style="margin-top: 1.25rem; display: flex; gap: 0.75rem; justify-content: center;">
                                    <button class="btn btn-primary btn-sm" @click="gunaso.trackingInput = gunaso.ticketId; trackGunasoStatus()">
                                        <i class="fas fa-search"></i>
                                        <span x-text="lang === 'ne' ? 'अहिले ट्र्याक गर्नुहोस्' : 'Track Now'"></span>
                                    </button>
                                    <button class="btn btn-outline btn-sm" @click="resetGunasoForm()">
                                        <i class="fas fa-plus"></i>
                                        <span x-text="lang === 'ne' ? 'अर्को गुनासो दर्ता' : 'Submit Another'"></span>
                                    </button>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- Right: Ticket Tracker -->
                    <div class="gunaso-tracker-box" id="track">
                        <h4 class="tracker-title" x-text="lang === 'ne' ? 'गुनासो अवस्था ट्र्याक गर्नुहोस्' : 'Track Grievance Status'"></h4>
                        <p class="tracker-desc" x-text="lang === 'ne' ? 'पहिले दर्ता गरेको टिकट नम्बर (उदा: ILM-102938) यहाँ हाल्नुहोस्:' : 'Enter your registered ticket code to check real-time progress:'"></p>

                        <div class="tracker-input-group">
                            <input type="text" class="form-input" style="text-transform: uppercase;"
                                   x-model="gunaso.trackingInput" placeholder="ILM-XXXXXX"
                                   @keyup.enter="trackGunasoStatus()">
                            <button class="btn btn-primary" @click="trackGunasoStatus()" :disabled="gunaso.isTracking">
                                <i class="fas" :class="gunaso.isTracking ? 'fa-spinner fa-spin' : 'fa-search'"></i>
                            </button>
                        </div>

                        <!-- Result Card -->
                        <template x-if="gunaso.trackResult && gunaso.trackResult !== 'NOT_FOUND'">
                            <div class="tracker-result-card">
                                <span class="tracker-badge-status" x-text="lang === 'ne' ? gunaso.trackResult.statusNe : gunaso.trackResult.status"></span>
                                <div class="tracker-detail-row">
                                    <span>Ticket ID:</span>
                                    <strong x-text="gunaso.trackResult.ticketId"></strong>
                                </div>
                                <div class="tracker-detail-row">
                                    <span x-text="lang === 'ne' ? 'क्षेत्र / वर्ग:' : 'Category:'"></span>
                                    <strong x-text="gunaso.trackResult.category"></strong>
                                </div>
                                <div class="tracker-detail-row">
                                    <span x-text="lang === 'ne' ? 'सम्बन्धित अधिकारी:' : 'Assigned To:'"></span>
                                    <strong x-text="lang === 'ne' ? gunaso.trackResult.assignedOfficerNe : gunaso.trackResult.assignedOfficer"></strong>
                                </div>
                                <div class="tracker-detail-row">
                                    <span x-text="lang === 'ne' ? 'दर्ता मिति:' : 'Submitted Date:'"></span>
                                    <strong x-text="gunaso.trackResult.submittedDate"></strong>
                                </div>
                                <div class="tracker-detail-row">
                                    <span x-text="lang === 'ne' ? 'अपेक्षित सम्बोधन:' : 'Est. Resolution:'"></span>
                                    <strong x-text="gunaso.trackResult.estimatedResolution"></strong>
                                </div>
                            </div>
                        </template>

                        <template x-if="gunaso.trackResult === 'NOT_FOUND'">
                            <div style="padding: 1rem; background: rgba(225, 29, 72, 0.1); border: 1px solid rgba(225, 29, 72, 0.3); border-radius: var(--radius-md); font-size: 0.85rem; color: #e11d48; text-align: center;">
                                <i class="fas fa-exclamation-triangle"></i>
                                <span x-text="lang === 'ne' ? 'उक्त टिकट फेला परेन। कृपया सही कोड प्रविष्ट गर्नुहोस्।' : 'No ticket found with this ID. Please check and retry.'"></span>
                            </div>
                        </template>

                        <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); font-size: 0.8rem; color: var(--text-muted);">
                            <p><i class="fas fa-shield-alt"></i> <span x-text="lang === 'ne' ? 'सबै जनगुनासोहरू सिधै संघीय संसद सचिवालयको निगरानीमा रहन्छन्।' : 'All submissions are encrypted and monitored by the Parliamentary Secretariat.'"></span></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <div class="footer-grid">
                <div>
                    <div class="footer-brand-logo">
                        <img :src="profile.emblemUrl" alt="Emblem" class="footer-emblem" onerror="this.src='https://giwmscdntwo.gov.np/static/assets/image/Emblem_of_Nepal.png'">
                        <div class="footer-brand-text">
                            <h3 x-text="lang === 'ne' ? profile.nameNe : profile.nameEn"></h3>
                            <p x-text="lang === 'ne' ? profile.roleNe + ', ' + profile.constituencyNe : profile.roleEn + ', ' + profile.constituencyEn"></p>
                        </div>
                    </div>
                    <p class="footer-desc" x-text="lang === 'ne' ? profile.bioNe : profile.bioEn"></p>
                    <div class="footer-social-links">
                        <a :href="profile.social.facebook" target="_blank" rel="noopener" class="social-btn" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                        <a :href="profile.social.twitter" target="_blank" rel="noopener" class="social-btn" aria-label="Twitter / X"><i class="fab fa-x-twitter"></i></a>
                        <a :href="profile.social.instagram" target="_blank" rel="noopener" class="social-btn" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                    </div>
                </div>
                <div class="footer-col">
                    <h4 x-text="lang === 'ne' ? 'द्रुत पृष्ठहरू' : 'Pages'"></h4>
                    <ul class="footer-links">
                        <li><a href="index.html" x-text="lang === 'ne' ? 'गृहपृष्ठ' : 'Home'"></a></li>
                        <li><a href="about.html" x-text="lang === 'ne' ? 'परिचय' : 'About'"></a></li>
                        <li><a href="projects.html" x-text="lang === 'ne' ? 'विकास आयोजना' : 'Projects Tracker'"></a></li>
                        <li><a href="media.html" x-text="lang === 'ne' ? 'मिडिया तथा ग्यालरी' : 'Media & Gallery'"></a></li>
                        <li><a href="constituency.html" x-text="lang === 'ne' ? 'निर्वाचन क्षेत्र' : 'Constituency Profile'"></a></li>
                        <li><a href="gunaso.html" x-text="lang === 'ne' ? 'जनगुनासो पोर्टल' : 'Citizen Grievance'"></a></li>
                        <li><a href="contact.html" x-text="lang === 'ne' ? 'सम्पर्क कार्यालय' : 'Contact Secretariat'"></a></li>
                    </ul>
                </div>
                <div class="footer-col">
                    <h4 x-text="lang === 'ne' ? 'सरकारी पोर्टल' : 'Official Portals'"></h4>
                    <ul class="footer-links">
                        <li><a href="https://hr.parliament.gov.np" target="_blank" rel="noopener" x-text="lang === 'ne' ? 'प्रतिनिधि सभा (संसद)' : 'Federal Parliament'"></a></li>
                        <li><a href="https://nepal.gov.np" target="_blank" rel="noopener" x-text="lang === 'ne' ? 'नेपाल सरकार' : 'Government of Nepal'"></a></li>
                    </ul>
                </div>
                <div class="footer-col">
