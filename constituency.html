<!DOCTYPE html>
<html lang="ne" x-data="parliamentApp()" :class="{ 'dark': theme === 'dark' }">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title x-text="lang === 'ne' ? 'निर्वाचन क्षेत्र परिचय — इलाम–१, कोशी प्रदेश' : 'Constituency Profile — Ilam-1, Koshi Province, Nepal'"></title>
    <meta name="description" content="In-depth geography, tourism hotspots, tea gardens, cardamom economy, and cultural heritage of Ilam Constituency No. 1.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Mukta:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">

    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</head>

<body :data-lang="lang">

    <!-- Civic Top Bar -->
    <header class="civic-top-bar">
        <div class="container civic-top-inner">
            <a href="https://hr.parliament.gov.np" target="_blank" rel="noopener" class="civic-left" title="House of Representatives, Nepal">
                <img :src="profile.emblemUrl" alt="Emblem" class="civic-emblem"
                    onerror="this.src='https://giwmscdntwo.gov.np/static/assets/image/Emblem_of_Nepal.png'">
                <div class="civic-institution">
                    <span class="civic-rep-title"
                        x-text="lang === 'ne' ? 'प्रतिनिधि सभा • संघीय संसद' : 'House of Representatives • Federal Parliament'"></span>
                    <span class="civic-mp-name" x-text="lang === 'ne' ? profile.nameNe : profile.nameEn"></span>
                    <span class="civic-constituency"
                        x-text="lang === 'ne' ? profile.constituencyNe : profile.constituencyEn"></span>
                </div>
            </a>
            <div class="civic-ticker">
                <span class="ticker-label"><i class="fas fa-bullhorn"></i> <span
                        x-text="lang === 'ne' ? 'ताजा समाचार' : 'Updates'"></span></span>
                <div class="ticker-marquee">
                    <marquee scrollamount="4" onmouseover="this.stop()" onmouseout="this.start()">
                        <template x-for="(news, index) in tickerNews" :key="index">
                            <span>
                                <a href="media.html" class="ticker-item"
                                    x-text="lang === 'ne' ? news.titleNe : news.titleEn"></a>
                                <span style="margin: 0 12px; opacity: 0.5;">•</span>
                            </span>
                        </template>
                    </marquee>
                </div>
            </div>
            <div class="civic-right">
                <div class="civic-date">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/9/9b/Flag_of_Nepal.svg" alt="Nepal Flag"
                        class="civic-flag">
                    <span x-text="lang === 'ne' ? currentDateNe : currentDateEn"></span>
                </div>
                <div class="civic-tools">
                    <button class="lang-btn" :class="{ 'active': lang === 'ne' }"
                        @click="setLanguage('ne')" title="नेपाली">ने</button>
                    <button class="lang-btn" :class="{ 'active': lang === 'en' }" @click="setLanguage('en')" title="English">EN</button>
                    <button class="theme-toggle-btn" @click="toggleTheme()" :title="theme === 'dark' ? 'Light Mode' : 'Dark Mode'">
                        <i class="fas" :class="theme === 'dark' ? 'fa-sun' : 'fa-moon'"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="main-nav" id="navbar">
        <div class="container nav-inner">
            <a href="index.html" class="nav-brand">
                <img src="https://giwmscdntwo.gov.np/static/assets/image/Emblem_of_Nepal.png" alt="Emblem"
                    style="width: 36px; height: 36px;">
                <div>
                    <span class="nav-brand-title" x-text="lang === 'ne' ? profile.nameNe : profile.nameEn"></span>
                    <span class="nav-brand-sub"
                        x-text="lang === 'ne' ? 'इलाम निर्वाचन क्षेत्र नं. १' : 'Ilam Constituency No. 1'"></span>
                </div>
            </a>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link"
                        x-text="lang === 'ne' ? 'गृहपृष्ठ' : 'Home'"></a></li>
                <li><a href="about.html" class="nav-link" x-text="lang === 'ne' ? 'परिचय' : 'About'"></a></li>
                <li><a href="projects.html" class="nav-link"
                        x-text="lang === 'ne' ? 'विकास आयोजना' : 'Projects'"></a></li>
                <li><a href="media.html" class="nav-link"
                        x-text="lang === 'ne' ? 'मिडिया तथा ग्यालरी' : 'Media & Gallery'"></a>
                </li>
                <li><a href="constituency.html" class="nav-link active"
                        x-text="lang === 'ne' ? 'क्षेत्र' : 'Constituency'"></a></li>
                <li><a href="contact.html" class="nav-link"
                        x-text="lang === 'ne' ? 'सम्पर्क' : 'Contact'"></a></li>
            </ul>
            <div class="nav-actions">
                <a href="gunaso.html" class="btn btn-accent btn-sm">
                    <i class="fas fa-headset"></i>
                    <span x-text="lang === 'ne' ? 'जनगुनासो पोर्टल' : 'Citizen Grievance'"></span>
                </a>
                <button class="mobile-toggle" @click="mobileMenu = !mobileMenu" aria-label="Toggle Mobile Menu"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </nav>

    <!-- Mobile Drawer -->
    <div class="mobile-drawer" x-show="mobileMenu" x-cloak style="display: none;">
        <div class="mobile-drawer-header">
            <div>
                <h3 style="font-weight: 800; color: var(--primary);"
                    x-text="lang === 'ne' ? profile.nameNe : profile.nameEn"></h3>
                <p style="font-size: 0.8rem; color: var(--text-muted);"
                    x-text="lang === 'ne' ? profile.constituencyNe : profile.constituencyEn"></p>
            </div>
            <button class="modal-close-btn" style="position: static;" @click="mobileMenu = false"><i
                    class="fas fa-times"></i></button>
        </div>
        <div class="mobile-drawer-links">
            <a href="index.html" class="mobile-drawer-link" @click="mobileMenu = false"
                x-text="lang === 'ne' ? 'गृहपृष्ठ' : 'Home'"></a>
            <a href="about.html" class="mobile-drawer-link" @click="mobileMenu = false"
                x-text="lang === 'ne' ? 'परिचय' : 'About'"></a>
            <a href="projects.html" class="mobile-drawer-link" @click="mobileMenu = false"
                x-text="lang === 'ne' ? 'विकास आयोजना' : 'Projects'"></a>
            <a href="media.html" class="mobile-drawer-link" @click="mobileMenu = false"
                x-text="lang === 'ne' ? 'मिडिया तथा ग्यालरी' : 'Media & Gallery'"></a>
            <a href="constituency.html" class="mobile-drawer-link" @click="mobileMenu = false"
                x-text="lang === 'ne' ? 'क्षेत्र' : 'Constituency'"></a>
            <a href="contact.html" class="mobile-drawer-link" @click="mobileMenu = false"
                x-text="lang === 'ne' ? 'सम्पर्क' : 'Contact'"></a>
        </div>
    </div>

    <!-- Banner Header with Animation -->
    <section class="page-banner">
        <div class="container">
            <span class="section-tag page-banner-tag"
                style="background: rgba(255,255,255,0.12); color: #fbbf24; border-color: rgba(255,255,255,0.2);"
                x-text="lang === 'ne' ? 'भूगोल तथा पहिचान' : 'Geography & Heritage'"></span>
            <h1 class="page-banner-title"
                x-text="lang === 'ne' ? 'इलाम निर्वाचन क्षेत्र नं. १ — परिचय' : 'Ilam Constituency No. 1'">
            </h1>
            <p class="page-banner-desc"
                x-text="lang === 'ne' ? 'सन्दकपुर देखि माई खोला सम्म: चिया, अलैंची, जैविक विविधता र साँस्कृतिक सम्पन्नताको संगम' : 'A rich tapestry of orthodox tea hills, Himalayan peaks, and vibrant multicultural heritage.'">
            </p>

            <!-- 4 Stars Divider -->
            <div class="nc-stars-divider">
                <div class="nc-star-line"></div>
                <i class="fas fa-star nc-star"></i>
                <i class="fas fa-star nc-star"></i>
                <i class="fas fa-star nc-star"></i>
                <i class="fas fa-star nc-star"></i>
                <div class="nc-star-line"></div>
            </div>
        </div>
    </section>

    <!-- Horizontal Data Strip -->
    <section style="background: var(--bg-surface); border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color);">
        <div class="container" style="display: grid; grid-template-columns: repeat(4, 1fr); divide-x: 1px solid;">
            <div style="padding: 2rem 2.5rem; border-right: 1px solid var(--border-color); display: flex; align-items: center; gap: 1.25rem;">
                <i class="fas fa-mountain-sun" style="font-size: 1.75rem; color: var(--parliament-blue); flex-shrink: 0;"></i>
                <div>
                    <div style="font-family: var(--font-heading); font-size: 1.65rem; font-weight: 900; color: var(--text-main); line-height: 1;">3,636m</div>
                    <div style="font-size: 0.82rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;"
                        x-text="lang === 'ne' ? 'सन्दकपुर उचाइ' : 'Sandakpur Altitude'"></div>
                </div>
            </div>
            <div style="padding: 2rem 2.5rem; border-right: 1px solid var(--border-color); display: flex; align-items: center; gap: 1.25rem;">
                <i class="fas fa-mug-hot" style="font-size: 1.75rem; color: var(--nc-green); flex-shrink: 0;"></i>
                <div>
                    <div style="font-family: var(--font-heading); font-size: 1.65rem; font-weight: 900; color: var(--text-main); line-height: 1;"
                        x-text="lang === 'ne' ? '२,४०,०००+' : '240,000+'"></div>
                    <div style="font-size: 0.82rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;"
                        x-text="lang === 'ne' ? 'चिया उत्पादक परिवार' : 'Tea Farming Families'">
                    </div>
                </div>
            </div>
            <div style="padding: 2rem 2.5rem; border-right: 1px solid var(--border-color); display: flex; align-items: center; gap: 1.25rem;">
                <i class="fas fa-users" style="font-size: 1.75rem; color: var(--accent-red); flex-shrink: 0;"></i>
                <div>
                    <div style="font-family: var(--font-heading); font-size: 1.65rem; font-weight: 900; color: var(--text-main); line-height: 1;"
                        x-text="lang === 'ne' ? '६ पालिका' : '6 Palika'"></div>
                    <div style="font-size: 0.82rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;"
                        x-text="lang === 'ne' ? 'स्थानीय तह' : 'Local Governments'"></div>
                </div>
            </div>
            <div style="padding: 2rem 2.5rem; display: flex; align-items: center; gap: 1.25rem;">
                <i class="fas fa-water" style="font-size: 1.75rem; color: #60a5fa; flex-shrink: 0;"></i>
                <div>
                    <div style="font-family: var(--font-heading); font-size: 1.65rem; font-weight: 900; color: var(--text-main); line-height: 1;">Ramsar</div>
                    <div style="font-size: 0.82rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;"
                        x-text="lang === 'ne' ? 'माई पोखरी सिमसार' : 'Mai Pokhari Wetland'">
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Editorial Pull-Quote + Narrative + Map -->
    <section class="section">
        <div class="container">

            <!-- Large Editorial Pull-Quote (Obama / NYT style) -->
            <div style="max-width: 820px; margin: 0 auto 5rem auto; text-align: center; padding: 0 2rem;">
                <div style="width: 48px; height: 3px; background: var(--accent-red); margin: 0 auto 2rem auto;"></div>
                <p style="font-family: var(--font-heading); font-size: clamp(1.4rem, 3vw, 2.2rem); font-weight: 700; line-height: 1.5; color: var(--text-main); font-style: italic;"
                    x-text="lang === 'ne'
                    ? '\"सन्दकपुरको चुचुरोबाट सगरमाथा देखिन्छ — र त्यही उचाइले हाम्रो सपनालाई पनि सीमित गर्दैन।\"'
                    : '\"From the summit of Sandakpur, you can see Everest — and from Ilam, we see a future just as limitless.\"'">
                </p>
                <div style="width: 48px; height: 3px; background: var(--border-color); margin: 2rem auto 0 auto;"></div>
            </div>

            <!-- Two-column: Narrative Left + Map Right -->
            <div style="display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 6rem; align-items: start;">
                <!-- Narrative -->
                <div>
                    <p style="font-size: 0.78rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--nc-green); margin-bottom: 1.25rem;"
                        x-text="lang === 'ne' ? 'निर्वाचन क्षेत्र परिचय' : 'Constituency Profile'">
                    </p>

                    <p style="color: var(--text-main); line-height: 1.85; font-size: 1.08rem; margin-bottom: 1.5rem;"
                        x-text="lang === 'ne'
                            ? 'इलाम निर्वाचन क्षेत्र नं. १ कोशी प्रदेशको पूर्वोत्तर पहाडी भेगमा अवस्थित छ। यस निर्वाचन क्षेत्र अन्तर्गत सन्दकपुर गाउँपालिका, माइजोगमाई गाउँपालिका, रोङ गाउँपालिका, सूर्योदय नगरपालिका, इलाम नगरपालिका तथा माई नगरपालिकाका महत्वपूर्ण वडाहरू पर्दछन्।'
                            : 'Ilam Constituency No. 1 is situated in the picturesque northeastern hills of Koshi Province, Nepal. It encompasses Sandakpur Rural Municipality, Maijogmai, Rong, and parts of Suryodaya, Ilam, and Mai Municipalities.'">
                    </p>
                    <p style="color: var(--text-main); line-height: 1.85; font-size: 1.08rem; margin-bottom: 2.5rem;"
                        x-text="lang === 'ne'
                            ? 'विश्व प्रसिद्ध कन्याम चिया बगान, माई पोखरी रामसार जैविक सिमसार, सन्दकपुर चुचुरो (३,६३६ मिटर) जहाँबाट सगरमाथा, कञ्चनजंघा लगायत चार सर्वोच्च हिमशृङ्खला एकैसाथ देख्न सकिन्छ, यस क्षेत्रका मुख्य पर्यटकीय तथा वातावरणीय धरोहर हुन्।'
                            : 'Key landmarks include the world-renowned Kanyam tea gardens, Mai Pokhari Ramsar wetland, and Sandakpur peak (3,636m) offering panoramic sunrise vistas of Mt. Everest, Kangchenjunga, Lhotse, and Makalu.'">
                    </p>

                    <!-- Key Facts as clean definition list -->
                    <div style="border-top: 2px solid var(--border-color);">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0;">
                            <div style="padding: 1.25rem 0; border-bottom: 1px solid var(--border-color); border-right: 1px solid var(--border-color); padding-right: 1.5rem;">
                                <div style="font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); margin-bottom: 0.3rem;"
                                    x-text="lang === 'ne' ? 'स्थान' : 'Location'"></div>
                                <div style="font-size: 0.95rem; font-weight: 700; color: var(--text-main);"
                                    x-text="lang === 'ne' ? 'इलाम, कोशी प्रदेश' : 'Ilam, Koshi Province'">
                                </div>
                            </div>
                            <div style="padding: 1.25rem 0 1.25rem 1.5rem; border-bottom: 1px solid var(--border-color);">
                                <div style="font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); margin-bottom: 0.3rem;"
                                    x-text="lang === 'ne' ? 'उचाइ' : 'Altitude'"></div>
                                <div style="font-size: 0.95rem; font-weight: 700; color: var(--text-main);"
                                    x-text="lang === 'ne' ? 'सन्दकपुर (३,६३६ मि.) देखि माई नदी' : 'Sandakpur (3,636m) to Mai Basin'">
                                </div>
                            </div>
                            <div style="padding: 1.25rem 0; border-bottom: 1px solid var(--border-color); border-right: 1px solid var(--border-color); padding-right: 1.5rem;">
                                <div style="font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); margin-bottom: 0.3rem;"
                                    x-text="lang === 'ne' ? 'मुख्य उत्पादन' : 'Exports'"></div>
                                <div style="font-size: 0.95rem; font-weight: 700; color: var(--text-main);"
                                    x-text="lang === 'ne' ? 'अर्थोडक्स चिया, अलैंची, अदुवा' : 'Orthodox Tea, Cardamom, Ginger'">
                                </div>
                            </div>
                            <div style="padding: 1.25rem 0 1.25rem 1.5rem; border-bottom: 1px solid var(--border-color);">
                                <div style="font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); margin-bottom: 0.3rem;"
                                    x-text="lang === 'ne' ? 'सांस्कृतिक विविधता' : 'Community'">
                                </div>
                                <div style="font-size: 0.95rem; font-weight: 700; color: var(--text-main);"
                                    x-text="lang === 'ne' ? 'किरात, लिम्बू, राई, ब्राह्मण, क्षेत्री' : 'Kirat, Limbu, Rai, Brahmin, Chhetri'">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Map -->
                <div style="position: sticky; top: 5rem;">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/30/Ilam1PratinidhiSabha.svg/500px-Ilam1PratinidhiSabha.svg.png"
                        alt="Ilam Constituency Map"
                        style="width: 100%; display: block; border: 1px solid var(--border-color);">
                    <p style="margin-top: 0.85rem; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;"
                        x-text="lang === 'ne' ? 'इलाम निर्वाचन क्षेत्र नं. १ — संसदीय निर्वाचन नक्सा' : 'Ilam-1 Parliamentary Constituency Map'">
                    </p>
                </div>
            </div>

        </div>
    </section>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <div class="footer-grid">
                <div>
                    <div class="footer-brand-logo">
                        <img :src="profile.emblemUrl" alt="Emblem" class="footer-emblem"
                            onerror="this.src='https://giwmscdntwo.gov.np/static/assets/image/Emblem_of_Nepal.png'">
                        <div class="footer-brand-text">
                            <h3 x-text="lang === 'ne' ? profile.nameNe : profile.nameEn"></h3>
                            <p x-text="lang === 'ne' ? profile.roleNe + ', ' + profile.constituencyNe : profile.roleEn + ', ' + profile.constituencyEn"></p>
                        </div>
                    </div>
                    <p class="footer-desc" x-text="lang === 'ne' ? profile.bioNe : profile.bioEn"></p>
                    <div class="footer-social-links">
                        <a :href="profile.social.facebook" target="_blank" rel="noopener" class="social-btn"
                            aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                        <a :href="profile.social.twitter" target="_blank" rel="noopener" class="social-btn"
                            aria-label="Twitter / X"><i class="fab fa-x-twitter"></i></a>
                        <a :href="profile.social.instagram" target="_blank" rel="noopener" class="social-btn"
                            aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                    </div>
                </div>

                <!-- Navigation Quick Links -->
                <div class="footer-col">
                    <h4 x-text="lang === 'ne' ? 'द्रुत पृष्ठहरू' : 'Pages'"></h4>
                    <ul class="footer-links">
                        <li><a href="about.html" x-text="lang === 'ne' ? 'परिचय तथा दृष्टिकोण' : 'About & Journey'"></a></li>
                        <li><a href="projects.html" x-text="lang === 'ne' ? 'विकास आयोजना' : 'Projects Tracker'"></a></li>
                        <li><a href="media.html" x-text="lang === 'ne' ? 'संसदीय भाषणहरू' : 'Speeches & Media'"></a></li>
                        <li><a href="constituency.html" x-text="lang === 'ne' ? 'निर्वाचन क्षेत्र' : 'Constituency Profile'"></a></li>
                        <li><a href="gunaso.html" x-text="lang === 'ne' ? 'जनगुनासो पोर्टल' : 'Citizen Grievance'"></a></li>
                        <li><a href="contact.html" x-text="lang === 'ne' ? 'सम्पर्क कार्यालय' : 'Contact Secretariat'"></a></li>
                    </ul>
                </div>

                <!-- Institutional Links -->
                <div class="footer-col">
                    <h4 x-text="lang === 'ne' ? 'सरकारी तथा संसदीय पोर्टल' : 'Official Portals'"></h4>
                    <ul class="footer-links">
                        <li><a href="https://hr.parliament.gov.np" target="_blank" rel="noopener"
