<!DOCTYPE html>
<html lang="ne" x-data="parliamentApp" :class="{ 'dark': theme === 'dark' }">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title x-text="lang === 'ne' ? 'परिचय तथा राजनीतिक यात्रा — माननीय निश्कल राई' : 'About & Political Journey — Hon. Nishcal Rai, MP'">
        About & Political Journey — Hon. Nishcal Rai
    </title>
    <meta name="description" content="Official biography, leadership philosophy, and comprehensive political journey of Hon. Nishcal Rai, Member of the House of Representatives for Ilam-1, Nepal.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Mukta:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script>
</head>
<body :data-lang="lang">

    <!-- Civic Top Bar -->
    <header class="civic-top-bar">
        <div class="container civic-top-inner">
            <a href="https://hr.parliament.gov.np" target="_blank" rel="noopener" class="civic-left" title="House of Representatives, Nepal">
                <img :src="profile.emblemUrl" alt="Emblem" class="civic-emblem" onerror="this.src='https://giwmscdntwo.gov.np/static/assets/image/Emblem_of_Nepal.png'">
                <div class="civic-institution">
                    <span class="civic-rep-title" x-text="lang === 'ne' ? 'प्रतिनिधि सभा • संघीय संसद' : 'House of Representatives • Federal Parliament'"></span>
                    <span class="civic-mp-name" x-text="lang === 'ne' ? profile.nameNe : profile.nameEn"></span>
                    <span class="civic-constituency" x-text="lang === 'ne' ? profile.constituencyNe : profile.constituencyEn"></span>
                </div>
            </a>
            <div class="civic-ticker">
                <span class="ticker-label"><i class="fas fa-bullhorn"></i> <span x-text="lang === 'ne' ? 'ताजा समाचार' : 'Updates'"></span></span>
                <div class="ticker-marquee">
                    <marquee scrollamount="4" onmouseover="this.stop()" onmouseout="this.start()">
                        <template x-for="(news, index) in tickerNews" :key="index">
                            <span>
                                <a href="media.html" class="ticker-item" x-text="lang === 'ne' ? news.titleNe : news.titleEn"></a>
                                <span style="margin: 0 12px; opacity: 0.5;">•</span>
                            </span>
                        </template>
                    </marquee>
                </div>
            </div>
            <div class="civic-right">
                <div class="civic-date">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/9/9b/Flag_of_Nepal.svg" alt="Nepal Flag" class="civic-flag">
                    <span x-text="lang === 'ne' ? currentDateNe : currentDateEn"></span>
                </div>
                <div class="civic-tools">
                    <button class="lang-btn" :class="{ 'active': lang === 'ne' }" @click="setLanguage('ne')">ने</button>
                    <button class="lang-btn" :class="{ 'active': lang === 'en' }" @click="setLanguage('en')">EN</button>
                    <button class="theme-toggle-btn" @click="toggleTheme()">
                        <i class="fas" :class="theme === 'dark' ? 'fa-sun' : 'fa-moon'"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Navigation -->
    <nav class="main-nav" id="navbar">
        <div class="container nav-inner">
            <a href="index.html" class="nav-brand">
                <img src="https://giwmscdntwo.gov.np/static/assets/image/Emblem_of_Nepal.png" alt="Emblem" style="width: 36px; height: 36px;">
                <div>
                    <span class="nav-brand-title" x-text="lang === 'ne' ? profile.nameNe : profile.nameEn"></span>
                    <span class="nav-brand-sub" x-text="lang === 'ne' ? 'इलाम निर्वाचन क्षेत्र नं. १' : 'Ilam Constituency No. 1'"></span>
                </div>
            </a>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link" x-text="lang === 'ne' ? 'गृहपृष्ठ' : 'Home'"></a></li>
                <li><a href="about.html" class="nav-link active" x-text="lang === 'ne' ? 'परिचय' : 'About'"></a></li>
                <li><a href="projects.html" class="nav-link" x-text="lang === 'ne' ? 'विकास आयोजना' : 'Projects'"></a></li>
                <li><a href="media.html" class="nav-link" x-text="lang === 'ne' ? 'मिडिया तथा ग्यालरी' : 'Media & Gallery'"></a></li>
                <li><a href="constituency.html" class="nav-link" x-text="lang === 'ne' ? 'क्षेत्र' : 'Constituency'"></a></li>
                <li><a href="contact.html" class="nav-link" x-text="lang === 'ne' ? 'सम्पर्क' : 'Contact'"></a></li>
            </ul>
            <div class="nav-actions">
                <a href="gunaso.html" class="btn btn-accent btn-sm">
                    <i class="fas fa-headset"></i>
                    <span x-text="lang === 'ne' ? 'जनगुनासो पोर्टल' : 'Citizen Grievance'"></span>
                </a>
                <button class="mobile-toggle" @click="mobileMenu = !mobileMenu"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </nav>

    <!-- Mobile Drawer -->
    <div class="mobile-drawer" x-show="mobileMenu" x-cloak style="display: none;">
        <div class="mobile-drawer-header">
            <div>
                <h3 style="font-weight: 800; color: var(--primary);" x-text="lang === 'ne' ? profile.nameNe : profile.nameEn"></h3>
                <p style="font-size: 0.8rem; color: var(--text-muted);" x-text="lang === 'ne' ? profile.constituencyNe : profile.constituencyEn"></p>
            </div>
            <button class="modal-close-btn" style="position: static;" @click="mobileMenu = false"><i class="fas fa-times"></i></button>
        </div>
        <div class="mobile-drawer-links">
            <a href="index.html" class="mobile-drawer-link" @click="mobileMenu = false" x-text="lang === 'ne' ? 'गृहपृष्ठ' : 'Home'"></a>
            <a href="about.html" class="mobile-drawer-link" @click="mobileMenu = false" x-text="lang === 'ne' ? 'परिचय' : 'About'"></a>
            <a href="projects.html" class="mobile-drawer-link" @click="mobileMenu = false" x-text="lang === 'ne' ? 'विकास आयोजना' : 'Projects'"></a>
            <a href="media.html" class="mobile-drawer-link" @click="mobileMenu = false" x-text="lang === 'ne' ? 'मिडिया तथा ग्यालरी' : 'Media & Gallery'"></a>
            <a href="constituency.html" class="mobile-drawer-link" @click="mobileMenu = false" x-text="lang === 'ne' ? 'क्षेत्र' : 'Constituency'"></a>
            <a href="contact.html" class="mobile-drawer-link" @click="mobileMenu = false" x-text="lang === 'ne' ? 'सम्पर्क' : 'Contact'"></a>
        </div>
    </div>

    <!-- ======================================================================
         Kamala Harris Presidential Editorial Header (Unboxed, Stately)
         ====================================================================== -->
    <header class="editorial-page-header">
        <div class="container">
            <div class="editorial-header-inner animate-fade-in-up">
                <h1 class="editorial-title" x-text="lang === 'ne' ? profile.nameNe : profile.nameEn"></h1>
                <p class="editorial-subtitle" x-text="lang === 'ne' ? 'प्रतिनिधि सभा सदस्य • इलाम–१ • नेपाली कांग्रेस' : 'Member of the House of Representatives • Ilam-1 • Nepali Congress'"></p>
                
                <!-- Quick In-Page Editorial Navigation -->
                <div class="editorial-nav-pills">
                    <a href="#biography" class="editorial-nav-link" x-text="lang === 'ne' ? 'परिचय' : 'Biography'"></a>
                    <span style="color: var(--border-color);">/</span>
                    <a href="#ideology" class="editorial-nav-link" x-text="lang === 'ne' ? 'आदर्श र मान्यता' : 'Ideology & Four Stars'"></a>
                    <span style="color: var(--border-color);">/</span>
                    <a href="#action" class="editorial-nav-link" x-text="lang === 'ne' ? 'संसदीय कार्य' : 'Legislative Action'"></a>
                    <span style="color: var(--border-color);">/</span>
                    <a href="#journey" class="editorial-nav-link" x-text="lang === 'ne' ? 'ऐतिहासिक यात्रा' : 'Political Journey'"></a>
                </div>
            </div>

            <!-- Grand Full-Width Featured Portrait Figure -->
            <figure class="editorial-featured-figure animate-fade-in-scale">
                <img :src="profile.photoUrl" :alt="profile.nameEn" class="editorial-featured-img"
                     onerror="this.src='https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=1200&q=80'">
                <figcaption class="editorial-caption" x-text="lang === 'ne' ? 'माननीय निश्कल राई — प्रतिनिधि सभा सदस्य, इलाम निर्वाचन क्षेत्र नं. १' : 'Hon. Nishcal Rai, Member of the House of Representatives (Federal Parliament of Nepal), directly elected from Ilam Constituency No. 1.'"></figcaption>
            </figure>
        </div>
    </header>

    <!-- ======================================================================
         Longform Editorial Biography Narrative
         ====================================================================== -->
    <main class="editorial-article-container" id="biography">
        
        <!-- Lead Statement -->
        <p class="editorial-lead animate-fade-in-up"
           x-text="lang === 'ne' 
            ? 'माननीय निश्कल राई सधैं जनताको अधिकार, सुशासन र पूर्वी नेपालको समृद्धिका लागि दृढतापूर्वक उभिनुहुन्छ — विद्यार्थी आन्दोलनको अग्रमोर्चादेखि प्रतिनिधि सभाको रोष्ट्रमसम्म।'
            : 'Hon. Nishcal Rai consistently champions the fundamental rights of citizens, zero-tolerance governance, and structural transformation for eastern Nepal — from youth democratic activism to the Federal Parliament.'">
        </p>

        <!-- Drop-cap Main Paragraph -->
        <p class="editorial-p editorial-drop-cap"
           x-text="lang === 'ne' 
            ? 'वि.सं. २०७९ को प्रतिनिधि सभा निर्वाचनमा इलाम निर्वाचन क्षेत्र नं. १ का सचेत नागरिकहरूको अपार विश्वास र समर्थनबाट प्रत्यक्ष निर्वाचित सांसद हुनुभएको हो। नेपाली कांग्रेसको मूल्यमान्यतामा आधारित लोकतान्त्रिक समाजवाद र जनउत्तरदायी राजनीतिलाई आत्मसात् गर्दै उहाँले नीति निर्माण, विधायी कार्य तथा विकास योजनाहरूको सशक्त नेतृत्व गरिरहनुभएको छ।'
            : 'In the 2022 Federal Parliamentary Elections, Hon. Nishcal Rai secured a decisive mandate as the directly elected representative of Ilam Constituency No. 1. Grounded in the enduring ideals of democratic socialism and civic accountability of the Nepali Congress, he spearheads transformative legislative initiatives, parliamentary scrutiny, and regional infrastructure revitalization.'">
        </p>

        <p class="editorial-p"
           x-text="lang === 'ne' 
            ? 'इलामका चिया, अलैंची, अदुवा, किवी तथा दुग्ध उत्पादक किसानहरूको श्रमको उचित मूल्य, ग्रामीण कृषि सडकको दिगो स्तरोन्नति, प्राविधिक तथा गुणस्तरीय शिक्षाको विस्तार, र स्वास्थ्य सेवामा नागरिकको सहज पहुँच उहाँको संसदीय यात्राको मूल मर्म हो। संसदका महत्वपूर्ण समितिहरूमा नीतिगत स्पष्टता र प्रमाणमा आधारित तथ्य प्रस्तुत गर्ने प्रखर वक्ताको रूपमा उहाँ सुपरिचित हुनुहुन्छ।'
            : 'His core legislative priorities center on institutionalizing fair pricing and export rebates for orthodox tea and cardamom farmers, modernizing rural transit corridors, democratizing high-quality technical STEM education, and expanding universal healthcare access across eastern hill communities.'">
        </p>

        <!-- Full-Width In-line Photo Break 1 -->
        <figure class="editorial-inline-figure animate-fade-in-scale" id="action">
            <img src="images/journey image.jpg" alt="Parliamentary Action" class="editorial-inline-img" loading="lazy">
            <figcaption class="editorial-caption" x-text="lang === 'ne' ? 'संसदीय समिति तथा राष्ट्रिय नीतिगत छलफलमा माननीय निश्कल राई सक्रिय सहभागिता जनाउँदै।' : 'Hon. Nishcal Rai actively deliberating on public infrastructure policy, transparency, and youth empowerment in the Federal Parliament.'"></figcaption>
        </figure>

        <!-- Kamala Harris Style Presidential Pullquote -->
        <figure class="editorial-pullquote">
            <blockquote>
                <p x-text="lang === 'ne' ? '“हाम्रो राजनीति सत्ता वा पदका लागि होइन; यो त जनताको दैनिक जीवनमा आत्मसम्मान, पारदर्शिता र समृद्धिका ढोका खोल्नका लागि हो।”' : '“Our politics is never about power or titles; it is an enduring instrument to restore dignity, enforce transparency, and unlock prosperity for every citizen.”'"></p>
                <cite x-text="lang === 'ne' ? '— माननीय निश्कल राई, प्रतिनिधि सभा सदस्य' : '— Hon. Nishcal Rai, Member of Parliament'"></cite>
            </blockquote>
        </figure>

        <!-- Stately Editorial Section: Four Pillars of Nepali Congress -->
        <div id="ideology" class="editorial-manifesto-box">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 1rem;">
                <h3 style="font-family: var(--font-heading); font-size: 1.6rem; font-weight: 900; color: var(--nc-green);" 
                    x-text="lang === 'ne' ? 'नेपाली कांग्रेसका चार आदर्श स्तम्भ (चार तारा)' : 'The Four Pillars of Nepali Congress'"></h3>
                <div style="display: flex; gap: 0.5rem; font-size: 1.15rem; color: var(--accent-red);">
                    <i class="fas fa-star"></i>
                    <i class="fas fa-star"></i>
                    <i class="fas fa-star"></i>
                    <i class="fas fa-star"></i>
                </div>
            </div>

            <p class="editorial-p" style="margin-bottom: 1.5rem;"
               x-text="lang === 'ne' 
                ? 'राष्ट्रियता, लोकतन्त्र, समाजवाद र व्यक्तिगत नागरिक स्वतन्त्रता — यी चार ऐतिहासिक आदर्शलाई शिरोधार्य गर्दै नेपाली कांग्रेसको झण्डामुनि जनताको जीवनस्तर उकास्ने, सामाजिक न्याय स्थापित गर्ने र विधिको शासनलाई अक्षुण्ण राख्ने हाम्रो दृढ प्रतिवद्धता छ।'
                : 'Nationalism, Democracy, Democratic Socialism, and Individual Liberty — guided by these four foundational ideals to protect the constitution, eliminate corruption, and deliver measurable prosperity to every household.'">
            </p>

            <a :href="profile.partyWebsite" target="_blank" rel="noopener" class="btn btn-congress" style="display: inline-flex; align-items: center; gap: 0.6rem; text-decoration: none;">
                <img :src="profile.partyLogoUrl" alt="NC Emblem" style="width: 20px; height: 20px; filter: brightness(0) invert(1);" onerror="this.style.display='none'">
                <span x-text="lang === 'ne' ? 'नेपाली कांग्रेस केन्द्रीय वेबसाइट भ्रमण गर्नुहोस्' : 'Visit Nepali Congress Official Portal'"></span>
                <i class="fas fa-arrow-up-right-from-square" style="font-size: 0.8rem;"></i>
            </a>
        </div>

        <!-- Legislative Performance Indicators (Unboxed Editorial Stats) -->
        <div class="editorial-stats-row">
            <div class="editorial-stat-item">
                <div class="editorial-stat-num">८०+</div>
                <div class="editorial-stat-label" x-text="lang === 'ne' ? 'संसदीय प्रश्न तथा विशेष समय बहस' : 'Parliamentary Speeches & Interpellations'"></div>
            </div>
            <div class="editorial-stat-item">
                <div class="editorial-stat-num">१००%</div>
                <div class="editorial-stat-label" x-text="lang === 'ne' ? 'संसदीय बैठक र समिति उपस्थिति' : 'House & Committee Attendance'"></div>
            </div>
            <div class="editorial-stat-item">
                <div class="editorial-stat-num">१४</div>
                <div class="editorial-stat-label" x-text="lang === 'ne' ? 'इलाम–१ का प्रत्यक्ष जोडिएका पालिका' : 'Directly Connected Municipalities'"></div>
            </div>
        </div>

        <!-- Section 2: Grassroots Commitment -->
        <h2 class="editorial-heading" x-text="lang === 'ne' ? 'जनतासँगको निरन्तर सम्वाद र स्थलगत उपस्थिति' : 'Grassroots Dialogue & Unwavering Public Presence'"></h2>

        <p class="editorial-p"
           x-text="lang === 'ne' 
            ? 'संसदको अधिवेशन सकिनासाथ राजधानीको चार पर्खालबाट बाहिर निस्केर इलामका दुर्गम वस्तीहरू, किसानका चियाबारीहरू, र गाउँ–गाउँका नागरिक भेलाहरूमा पुग्नु उहाँको नियमित अभ्यास हो। नागरिकका गुनासा प्रत्यक्ष सुन्नु, बजेट विनियोजनको स्थलगत अनुगमन गर्नु, र जनताको सुझावलाई नीतिमा रूपान्तरण गर्नु नै जनप्रतिनिधिको सच्चा धर्म हो।'
            : 'As soon as legislative sessions adjourn, Hon. Rai returns to the hill communities of Ilam — visiting tea plantations, inspecting rural road construction, and convening open town halls. Listening directly to citizen grievances and translating regional necessities into federal policy remains the core of his public service.'">
        </p>

        <!-- Full-Width In-line Photo Break 2 -->
        <figure class="editorial-inline-figure animate-fade-in-scale">
            <img src="images/another image.jpg" alt="Community Dialogue" class="editorial-inline-img" loading="lazy">
            <figcaption class="editorial-caption" x-text="lang === 'ne' ? 'इलाम निर्वाचन क्षेत्र नं. १ का नागरिक तथा किसान समुदायसँग खुला अन्तरक्रिया र विकास छलफल।' : 'Direct grassroots engagement with farmers, women entrepreneurs, and local community representatives across Ilam-1.'"></figcaption>
        </figure>

        <p class="editorial-p"
           x-text="lang === 'ne' 
            ? 'पूर्वी पहाडको जलविद्युत, पर्यटकीय सम्भावना, अर्गानिक कृषि उत्पादन, र युवा उद्यमशीलतालाई अन्तर्राष्ट्रिय बजारसँग जोड्न उहाँले दीर्घकालीन योजना अघि सार्नुभएको छ। स्वच्छ, पारदर्शी र जवाफदेही नेतृत्व नै नयाँ नेपालको भविष्य हो।'
            : 'He has advanced strategic policy frameworks linking eastern Nepal’s hydropower, eco-tourism, high-value organic agriculture, and youth innovation to domestic and international markets. Clean, transparent, and responsive governance is the pathway forward.'">
        </p>

    </main>

    <!-- ======================================================================
         Comprehensive Political Journey Timeline (Centered & Perfectly Aligned)
         ====================================================================== -->
    <section class="section section-muted" id="journey">
        <div class="container">
            <div class="section-header">
                <span class="section-tag" x-text="lang === 'ne' ? 'ऐतिहासिक माइलस्टोन' : 'Milestones & History'"></span>
                <h2 class="section-title" x-text="lang === 'ne' ? 'राजनीतिक तथा सामाजिक संघर्षको यात्रा' : 'Political Journey & Milestones'"></h2>
                <p class="section-subtitle" x-text="lang === 'ne' ? 'विद्यार्थी आन्दोलन देखि प्रतिनिधि सभा सदस्य सम्मको प्रेरणादायी यात्रा' : 'Key transformative chapters in leadership, activism, and public governance'"></p>
                
                <!-- 4 Stars Divider -->
                <div class="nc-stars-divider">
                    <div class="nc-star-line"></div>
                    <i class="fas fa-star nc-star"></i>
                    <i class="fas fa-star nc-star"></i>
                    <i class="fas fa-star nc-star"></i>
                    <i class="fas fa-star nc-star"></i>
                    <div class="nc-star-line"></div>
                </div>
            </div>

            <div class="timeline-wrap">
                <template x-for="(item, index) in journey" :key="index">
                    <div class="timeline-item">
                        <div class="timeline-content">
