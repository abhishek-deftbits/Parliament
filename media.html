<!DOCTYPE html>
<html lang="ne" class="light" x-data="parliamentApp()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title x-text="lang === 'ne' ? 'संसदीय सम्बोधन, भिडियो तथा फोटो ग्यालरी — माननीय निश्कल राई' : 'Speeches, Media & Photo Gallery — Hon. Nishcal Rai'"></title>
    
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Mukta:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Pro / Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom Style & Components -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">

    <!-- Alpine.js Core & Plugins -->
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Application Data & Logic -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</head>
<body :class="{ 'dark': theme === 'dark' }" :data-lang="lang">

    <!-- Civic Top Bar -->
    <header class="civic-top-bar">
        <div class="container civic-top-inner">
            <a href="https://hr.parliament.gov.np" target="_blank" rel="noopener" class="civic-left" title="House of Representatives, Nepal">
                <img :src="profile.emblemUrl" alt="Emblem" class="civic-emblem" onerror="this.src='https://giwmscdntwo.gov.np/static/assets/image/Emblem_of_Nepal.png'">
                <div class="civic-institution">
                    <span class="civic-rep-title" x-text="lang === 'ne' ? 'प्रतिनिधि सभा • संघीय संसद' : 'House of Representatives • Federal Parliament'"></span>
                    <span class="civic-mp-name" x-text="lang === 'ne' ? profile.nameNe : profile.nameEn"></span>
                    <span class="civic-constituency" x-text="lang === 'ne' ? profile.constituencyNe : profile.constituencyEn"></span>
                </div>
            </a>
            <div class="civic-ticker">
                <span class="ticker-label"><i class="fas fa-bullhorn"></i> <span x-text="lang === 'ne' ? 'ताजा समाचार' : 'Updates'"></span></span>
                <div class="ticker-marquee">
                    <marquee scrollamount="4" onmouseover="this.stop()" onmouseout="this.start()">
                        <template x-for="(news, index) in tickerNews" :key="index">
                            <span>
                                <a href="media.html" class="ticker-item" x-text="lang === 'ne' ? news.titleNe : news.titleEn"></a>
                                <span style="margin: 0 12px; opacity: 0.5;">•</span>
                            </span>
                        </template>
                    </marquee>
                </div>
            </div>
            <div class="civic-right">
                <div class="civic-date">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/9/9b/Flag_of_Nepal.svg" alt="Nepal Flag" class="civic-flag">
                    <span x-text="lang === 'ne' ? currentDateNe : currentDateEn"></span>
                </div>
                <div class="civic-tools">
                    <button class="lang-btn" :class="{ 'active': lang === 'ne' }" @click="setLanguage('ne')" title="नेपाली">ने</button>
                    <button class="lang-btn" :class="{ 'active': lang === 'en' }" @click="setLanguage('en')" title="English">EN</button>
                    <button class="theme-toggle-btn" @click="toggleTheme()" :title="theme === 'dark' ? 'Light Mode' : 'Dark Mode'">
                        <i class="fas" :class="theme === 'dark' ? 'fa-sun' : 'fa-moon'"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="main-nav" id="navbar">
        <div class="container nav-inner">
            <a href="index.html" class="nav-brand">
                <img src="https://giwmscdntwo.gov.np/static/assets/image/Emblem_of_Nepal.png" alt="Emblem" style="width: 36px; height: 36px;">
                <div>
                    <span class="nav-brand-title" x-text="lang === 'ne' ? profile.nameNe : profile.nameEn"></span>
                    <span class="nav-brand-sub" x-text="lang === 'ne' ? 'इलाम निर्वाचन क्षेत्र नं. १' : 'Ilam Constituency No. 1'"></span>
                </div>
            </a>
            <ul class="nav-links">
                <li><a href="index.html" class="nav-link" x-text="lang === 'ne' ? 'गृहपृष्ठ' : 'Home'"></a></li>
                <li><a href="about.html" class="nav-link" x-text="lang === 'ne' ? 'परिचय' : 'About'"></a></li>
                <li><a href="projects.html" class="nav-link" x-text="lang === 'ne' ? 'विकास आयोजना' : 'Projects'"></a></li>
                <li><a href="media.html" class="nav-link active" x-text="lang === 'ne' ? 'मिडिया तथा ग्यालरी' : 'Media & Gallery'"></a></li>
                <li><a href="constituency.html" class="nav-link" x-text="lang === 'ne' ? 'क्षेत्र' : 'Constituency'"></a></li>
                <li><a href="contact.html" class="nav-link" x-text="lang === 'ne' ? 'सम्पर्क' : 'Contact'"></a></li>
            </ul>
            <div class="nav-actions">
                <a href="gunaso.html" class="btn btn-accent btn-sm">
                    <i class="fas fa-headset"></i>
                    <span x-text="lang === 'ne' ? 'जनगुनासो पोर्टल' : 'Citizen Grievance'"></span>
                </a>
                <button class="mobile-toggle" @click="mobileMenu = !mobileMenu" aria-label="Toggle Mobile Menu"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </nav>

    <!-- Mobile Drawer -->
    <div class="mobile-drawer" x-show="mobileMenu" x-cloak style="display: none;">
        <div class="mobile-drawer-header">
            <div>
                <h3 style="font-weight: 800; color: var(--primary);" x-text="lang === 'ne' ? profile.nameNe : profile.nameEn"></h3>
                <p style="font-size: 0.8rem; color: var(--text-muted);" x-text="lang === 'ne' ? profile.constituencyNe : profile.constituencyEn"></p>
            </div>
            <button class="modal-close-btn" style="position: static;" @click="mobileMenu = false"><i class="fas fa-times"></i></button>
        </div>
        <div class="mobile-drawer-links">
            <a href="index.html" class="mobile-drawer-link" @click="mobileMenu = false" x-text="lang === 'ne' ? 'गृहपृष्ठ' : 'Home'"></a>
            <a href="about.html" class="mobile-drawer-link" @click="mobileMenu = false" x-text="lang === 'ne' ? 'परिचय' : 'About'"></a>
            <a href="projects.html" class="mobile-drawer-link" @click="mobileMenu = false" x-text="lang === 'ne' ? 'विकास आयोजना' : 'Projects'"></a>
            <a href="media.html" class="mobile-drawer-link" @click="mobileMenu = false" x-text="lang === 'ne' ? 'मिडिया तथा ग्यालरी' : 'Media & Gallery'"></a>
            <a href="constituency.html" class="mobile-drawer-link" @click="mobileMenu = false" x-text="lang === 'ne' ? 'क्षेत्र' : 'Constituency'"></a>
            <a href="contact.html" class="mobile-drawer-link" @click="mobileMenu = false" x-text="lang === 'ne' ? 'सम्पर्क' : 'Contact'"></a>
        </div>
    </div>

    <!-- Banner Header with Animation -->
    <section class="page-banner">
        <div class="container">
            <span class="section-tag page-banner-tag" style="background: rgba(255,255,255,0.12); color: #fbbf24; border-color: rgba(255,255,255,0.2);"
                  x-text="lang === 'ne' ? 'संसदीय प्रसारण, भिडियो तथा तस्विर अभिलेख' : 'Speeches, Broadcasts & Photo Gallery'"></span>
            <h1 class="page-banner-title"
                x-text="lang === 'ne' ? 'संसदीय सम्बोधन, भिडियो तथा फोटो ग्यालरी' : 'Speeches, Media & Photo Gallery'"></h1>
            <p class="page-banner-desc"
               x-text="lang === 'ne' ? 'प्रतिनिधि सभा बैठक, शून्य समय, राष्ट्रिय टेलिभिजन अन्तरवार्ता तथा स्थलगत विकास अनुगमनका तस्विरहरू' : 'Watch keynote parliamentary addresses, television debates, and explore high-resolution photo highlights.'"></p>
            
            <!-- 4 Stars Divider -->
            <div class="nc-stars-divider">
                <div class="nc-star-line"></div>
                <i class="fas fa-star nc-star"></i>
                <i class="fas fa-star nc-star"></i>
                <i class="fas fa-star nc-star"></i>
                <i class="fas fa-star nc-star"></i>
                <div class="nc-star-line"></div>
            </div>
        </div>
    </section>

    <!-- Unified Media & Gallery Section -->
    <section class="section" x-data="{ mediaSectionTab: 'videos' }">
        <div class="container">

            <!-- Section Switcher Header -->
            <div class="media-section-header-wrap">
                <div class="media-view-switcher">
                    <button type="button"
                            class="media-view-tab"
                            :class="{ 'active': mediaSectionTab === 'videos' }"
                            @click="mediaSectionTab = 'videos'">
                        <i class="fas fa-play-circle"></i>
                        <span x-text="lang === 'ne' ? 'संसदीय भाषण तथा भिडियो' : 'Speeches & Video Archive'"></span>
                    </button>
                    <button type="button"
                            class="media-view-tab"
                            :class="{ 'active': mediaSectionTab === 'photos' }"
                            @click="mediaSectionTab = 'photos'">
                        <i class="fas fa-images"></i>
                        <span x-text="lang === 'ne' ? 'फोटो ग्यालरी तथा गतिविधि' : 'Photo Gallery'"></span>
                    </button>
                </div>

                <!-- Live Counter -->
                <div style="font-size: 0.88rem; font-weight: 700; color: var(--text-muted);">
                    <span x-show="mediaSectionTab === 'videos'" x-text="filteredMedia.length + (lang === 'ne' ? ' भिडियो अभिलेख' : ' recorded speeches')"></span>
                    <span x-show="mediaSectionTab === 'photos'" x-text="filteredGallery.length + (lang === 'ne' ? ' तस्विरहरू' : ' curated photos')"></span>
                </div>
            </div>

            <!-- ==========================================================
                 1. SPEECHES & VIDEO ARCHIVE
                 ========================================================== -->
            <div x-show="mediaSectionTab === 'videos'" x-transition>

                <!-- Header + Search Row -->
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; gap: 1.5rem; flex-wrap: wrap;">
                    <div>
                        <span class="section-tag" x-text="lang === 'ne' ? 'संसद तथा राष्ट्रिय प्रसारण' : 'Parliamentary Broadcasts'"></span>
                        <h2 style="font-family: var(--font-heading); font-size: 2rem; font-weight: 900; color: var(--text-main); margin-top: 0.35rem;"
                            x-text="lang === 'ne' ? 'संसदीय सम्बोधन तथा भिडियो अभिलेख' : 'Speeches & Video Archive'"></h2>
                    </div>

                    <!-- Search Box -->
                    <div style="position: relative; min-width: 280px; flex-shrink: 0;">
                        <i class="fas fa-search" style="position: absolute; left: 1.1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.9rem; pointer-events: none;"></i>
                        <input type="text"
                               class="form-input"
                               style="padding-left: 2.75rem; border-radius: var(--radius-full); height: 46px; font-size: 0.92rem;"
                               x-model="mediaSearchQuery"
                               :placeholder="lang === 'ne' ? 'भाषण वा बहस खोज्नुहोस्...' : 'Search speeches by topic...'">
                    </div>
                </div>

                <!-- Category Filter Chips -->
                <div class="filter-chips-wrap">
                    <button type="button"
                            class="filter-chip"
                            :class="{ 'active': activeMediaTab === 'all' }"
                            @click="activeMediaTab = 'all'">
                        <i class="fas fa-layer-group"></i>
                        <span x-text="lang === 'ne' ? 'सबै भिडियो' : 'All Videos'"></span>
                    </button>
                    <button type="button"
                            class="filter-chip"
                            :class="{ 'active': activeMediaTab === 'speech' }"
                            @click="activeMediaTab = 'speech'">
                        <i class="fas fa-landmark"></i>
                        <span x-text="lang === 'ne' ? 'संसदीय भाषणहरू' : 'Parliament Speeches'"></span>
                    </button>
                    <button type="button"
                            class="filter-chip"
                            :class="{ 'active': activeMediaTab === 'media' }"
                            @click="activeMediaTab = 'media'">
                        <i class="fas fa-tv"></i>
                        <span x-text="lang === 'ne' ? 'अन्तरवार्ता तथा बहस' : 'Interviews & Debates'"></span>
                    </button>
                </div>

                <!-- Editorial Speech List Rows -->
                <div style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 3.5rem;">
                    <template x-for="(item, index) in filteredMedia" :key="item.id">
                        <div class="speech-row" @click="openVideoModal(item)">
                            <!-- Numeric Ledger ID -->
                            <div class="speech-row-num" x-text="String(index + 1).padStart(2, '0')"></div>

                            <!-- Thumbnail -->
                            <div class="speech-thumb-wrap">
                                <img :src="item.thumbnail" :alt="lang === 'ne' ? item.titleNe : item.titleEn" class="speech-thumb-img" loading="lazy">
                                <div class="speech-play-overlay">
                                    <div class="speech-play-badge"><i class="fas fa-play"></i></div>
                                </div>
                            </div>

                            <!-- Details -->
                            <div>
                                <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.45rem;">
                                    <span style="font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: var(--nc-green);"
                                          x-text="lang === 'ne' ? item.categoryNe : item.categoryEn"></span>
                                    <span style="width: 4px; height: 4px; border-radius: 50%; background: var(--text-muted); opacity: 0.6;"></span>
                                    <span style="font-size: 0.75rem; font-weight: 600; color: var(--text-muted);"
                                          x-text="lang === 'ne' ? item.dateNe : item.dateEn"></span>
                                </div>
                                <h4 style="font-family: var(--font-heading); font-size: 1.12rem; font-weight: 800; color: var(--text-main); line-height: 1.35; margin-bottom: 0.35rem;"
                                    x-text="lang === 'ne' ? item.titleNe : item.titleEn"></h4>
                                <p style="font-size: 0.88rem; color: var(--text-muted); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;"
                                   x-text="lang === 'ne' ? item.summaryNe : item.summaryEn"></p>
                            </div>

                            <!-- Arrow Circle CTA -->
                            <div class="speech-arrow-btn">
                                <i class="fas fa-arrow-right" style="font-size: 0.88rem;"></i>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Empty State -->
                <template x-if="filteredMedia.length === 0">
                    <div style="padding: 5rem 0; text-align: center; color: var(--text-muted); border-top: 1px solid var(--border-color);">
                        <i class="fas fa-video-slash" style="font-size: 2.75rem; opacity: 0.3; display: block; margin-bottom: 1rem;"></i>
                        <p style="font-size: 1.05rem; font-weight: 600;" x-text="lang === 'ne' ? 'कुनै भिडियो फेला परेन। कृपया फरक शब्द प्रयोग गर्नुहोस्।' : 'No media items matched your search query.'"></p>
                    </div>
                </template>
            </div>

            <!-- ==========================================================
                 2. PHOTO GALLERY & ACTIVITIES
                 ========================================================== -->
            <div x-show="mediaSectionTab === 'photos'" x-transition>

                <!-- Header Row -->
                <div style="margin-bottom: 2rem;">
                    <span class="section-tag tag-congress" x-text="lang === 'ne' ? 'तस्विर अभिलेख तथा गतिविधि' : 'Visual Highlights & Fieldwork'"></span>
                    <h2 style="font-family: var(--font-heading); font-size: 2rem; font-weight: 900; color: var(--text-main); margin-top: 0.35rem;"
                        x-text="lang === 'ne' ? 'फोटो ग्यालरी तथा स्थलगत गतिविधि' : 'Photo Gallery & Field Highlights'"></h2>
                </div>

                <!-- Category Filter Chips -->
                <div class="filter-chips-wrap">
                    <button type="button"
                            class="filter-chip tag-green"
                            :class="{ 'active': activeGalleryTab === 'all' }"
                            @click="activeGalleryTab = 'all'">
                        <i class="fas fa-border-all"></i>
                        <span x-text="lang === 'ne' ? 'सबै फोटो' : 'All Photos'"></span>
                    </button>
                    <button type="button"
                            class="filter-chip tag-green"
                            :class="{ 'active': activeGalleryTab === 'parliament' }"
                            @click="activeGalleryTab = 'parliament'">
                        <i class="fas fa-landmark"></i>
                        <span x-text="lang === 'ne' ? 'संसदीय गतिविधि' : 'Parliament'"></span>
                    </button>
                    <button type="button"
                            class="filter-chip tag-green"
                            :class="{ 'active': activeGalleryTab === 'constituency' }"
                            @click="activeGalleryTab = 'constituency'">
                        <i class="fas fa-users"></i>
                        <span x-text="lang === 'ne' ? 'जनतासँग भेटघाट' : 'Community'"></span>
                    </button>
                    <button type="button"
                            class="filter-chip tag-green"
                            :class="{ 'active': activeGalleryTab === 'development' }"
                            @click="activeGalleryTab = 'development'">
                        <i class="fas fa-hard-hat"></i>
                        <span x-text="lang === 'ne' ? 'विकास अनुगमन' : 'Inspections'"></span>
                    </button>
                    <button type="button"
                            class="filter-chip tag-green"
                            :class="{ 'active': activeGalleryTab === 'youth' }"
                            @click="activeGalleryTab = 'youth'">
                        <i class="fas fa-graduation-cap"></i>
                        <span x-text="lang === 'ne' ? 'शिक्षा तथा युवा' : 'Youth & Tech'"></span>
                    </button>
                </div>

                <!-- Modern Masonry Gallery Wall -->
                <div class="gallery-masonry-wall">
                    <template x-for="(photo, index) in filteredGallery" :key="photo.id">
                        <div class="gallery-masonry-item" @click="openGalleryModal(index)">
                            <img :src="photo.thumb" :alt="lang === 'ne' ? photo.titleNe : photo.titleEn" class="gallery-masonry-img" loading="lazy">
                            <div class="gallery-masonry-caption">
                                <span style="font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; color: #4ade80; margin-bottom: 0.35rem;"
                                      x-text="lang === 'ne' ? photo.categoryNe : photo.categoryEn"></span>
                                <h4 style="font-family: var(--font-heading); font-size: 1.05rem; font-weight: 800; color: #ffffff; line-height: 1.3;"
                                    x-text="lang === 'ne' ? photo.titleNe : photo.titleEn"></h4>
                            </div>
                        </div>
                    </template>
                </div>

            </div>

        </div>
    </section>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="container">
            <div class="footer-grid">
                <div>
                    <div class="footer-brand-logo">
                        <img :src="profile.emblemUrl" alt="Emblem" class="footer-emblem" onerror="this.src='https://giwmscdntwo.gov.np/static/assets/image/Emblem_of_Nepal.png'">
                        <div class="footer-brand-text">
                            <h3 x-text="lang === 'ne' ? profile.nameNe : profile.nameEn"></h3>
                            <p x-text="lang === 'ne' ? profile.roleNe + ', ' + profile.constituencyNe : profile.roleEn + ', ' + profile.constituencyEn"></p>
                        </div>
                    </div>
                    <p class="footer-desc" x-text="lang === 'ne' ? profile.bioNe : profile.bioEn"></p>
                    <div class="footer-social-links">
                        <a :href="profile.social.facebook" target="_blank" rel="noopener" class="social-btn" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                        <a :href="profile.social.twitter" target="_blank" rel="noopener" class="social-btn" aria-label="Twitter / X"><i class="fab fa-x-twitter"></i></a>
                        <a :href="profile.social.instagram" target="_blank" rel="noopener" class="social-btn" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                    </div>
                </div>

                <!-- Navigation Quick Links -->
                <div class="footer-col">
                    <h4 x-text="lang === 'ne' ? 'द्रुत पृष्ठहरू' : 'Pages'"></h4>
                    <ul class="footer-links">
                        <li><a href="about.html" x-text="lang === 'ne' ? 'परिचय तथा दृष्टिकोण' : 'About & Journey'"></a></li>
                        <li><a href="projects.html" x-text="lang === 'ne' ? 'विकास आयोजना' : 'Projects Tracker'"></a></li>
                        <li><a href="media.html" x-text="lang === 'ne' ? 'संसदीय भाषणहरू' : 'Speeches & Media'"></a></li>
                        <li><a href="constituency.html" x-text="lang === 'ne' ? 'निर्वाचन क्षेत्र' : 'Constituency Profile'"></a></li>
                        <li><a href="gunaso.html" x-text="lang === 'ne' ? 'जनगुनासो पोर्टल' : 'Citizen Grievance'"></a></li>
                        <li><a href="contact.html" x-text="lang === 'ne' ? 'सम्पर्क कार्यालय' : 'Contact Secretariat'"></a></li>
                    </ul>
                </div>

                <!-- Institutional Links -->
                <div class="footer-col">
                    <h4 x-text="lang === 'ne' ? 'सरकारी तथा संसदीय पोर्टल' : 'Official Portals'"></h4>
                    <ul class="footer-links">
                        <li><a href="https://hr.parliament.gov.np" target="_blank" rel="noopener" x-text="lang === 'ne' ? 'प्रतिनिधि सभा (संसद)' : 'Federal Parliament'"></a></li>
                        <li><a href="https://nepal.gov.np" target="_blank" rel="noopener" x-text="lang === 'ne' ? 'नेपाल सरकार आधिकारिक पोर्टल' : 'Government of Nepal'"></a></li>
                        <li><a href="https://nepalicongress.org" target="_blank" rel="noopener" x-text="lang === 'ne' ? 'नेपाली कांग्रेस' : 'Nepali Congress'"></a></li>
                        <li><a href="https://koshi.gov.np" target="_blank" rel="noopener" x-text="lang === 'ne' ? 'कोशी प्रदेश सरकार' : 'Koshi Province Gov.'"></a></li>
                        <li><a href="https://ilam.gov.np" target="_blank" rel="noopener" x-text="lang === 'ne' ? 'इलाम जिल्ला समन्वय' : 'Ilam District Portal'"></a></li>
                    </ul>
                </div>

                <!-- Liaison Office Summary -->
                <div class="footer-col">
                    <h4 x-text="lang === 'ne' ? 'सम्पर्क सचिवालय' : 'Office Liaison'"></h4>
                    <p style="font-size: 0.85rem; color: #cbd5e1; margin-bottom: 0.5rem;"><i class="fas fa-location-dot"></i> <span x-text="profile.centralOffice"></span></p>
                    <p style="font-size: 0.85rem; color: #cbd5e1; margin-bottom: 0.5rem;"><i class="fas fa-phone"></i> <span x-text="profile.phone"></span></p>
                    <p style="font-size: 0.85rem; color: #cbd5e1; margin-bottom: 0.5rem;"><i class="fas fa-envelope"></i> <span x-text="profile.email"></span></p>
                    <p style="font-size: 0.85rem; color: #fbbf24;"><i class="fas fa-clock"></i> <span x-text="lang === 'ne' ? profile.officeHoursNe : profile.officeHoursEn"></span></p>
                </div>
            </div>

            <!-- Footer Bottom Bar -->
            <div class="footer-bottom">
                <div>
                    <span x-text="'© 2026 ' + (lang === 'ne' ? profile.nameNe : profile.nameEn) + ' — ' + (lang === 'ne' ? 'प्रतिनिधि सभा सदस्य, इलाम–१। सर्वाधिकार सुरक्षित।' : 'Member of Parliament, Ilam-1. All rights reserved.')"></span>
                </div>
                <div>
                    <span x-text="lang === 'ne' ? 'पारदर्शिता, जनउत्तरदायित्व र लोकतान्त्रिक मूल्यमा आधारित' : 'Committed to Transparency, Good Governance & Public Service'"></span>
                </div>
            </div>
        </div>
    </footer>

    <!-- Video Modal Lightbox -->
    <div class="modal-backdrop" x-show="videoModal.isOpen" x-cloak style="display: none;" @click.self="closeVideoModal()">
        <div class="modal-container video-modal-container">
            <button class="modal-close-btn" @click="closeVideoModal()"><i class="fas fa-times"></i></button>
            <div class="video-frame-wrap">
                <template x-if="videoModal.isOpen">
                    <iframe :src="'https://www.youtube-nocookie.com/embed/' + videoModal.youtubeId + '?autoplay=1'"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                            allowfullscreen></iframe>
                </template>
            </div>
            <div class="video-modal-info">
                <span class="video-modal-category" x-text="videoModal.category"></span>
                <h3 class="video-modal-title" x-text="videoModal.title"></h3>
            </div>
        </div>
    </div>

    <!-- Image Gallery Lightbox Modal -->
    <div class="modal-backdrop" x-show="galleryModal.isOpen" x-cloak style="display: none;" @click.self="closeGalleryModal()">
        <div class="gallery-modal-container">
            <button class="modal-close-btn" style="top: -10px; right: 0;" @click="closeGalleryModal()"><i class="fas fa-times"></i></button>
            
            <div class="gallery-modal-stage">
                <button class="gallery-nav-btn prev" @click="prevGalleryImage()" title="Previous Image (Left Arrow)"><i class="fas fa-chevron-left"></i></button>
                
                <template x-if="galleryModal.activeList.length > 0">
                    <img :src="galleryModal.activeList[galleryModal.currentIndex].full" 
                         :alt="galleryModal.activeList[galleryModal.currentIndex].titleEn"
                         class="gallery-modal-img">
                </template>
                
                <button class="gallery-nav-btn next" @click="nextGalleryImage()" title="Next Image (Right Arrow)"><i class="fas fa-chevron-right"></i></button>
            </div>

            <div class="gallery-modal-caption-box" x-show="galleryModal.activeList.length > 0">
                <div class="gallery-caption-text">
                    <h4 x-text="lang === 'ne' ? galleryModal.activeList[galleryModal.currentIndex].titleNe : galleryModal.activeList[galleryModal.currentIndex].titleEn"></h4>
                    <p x-text="lang === 'ne' ? galleryModal.activeList[galleryModal.currentIndex].descNe : galleryModal.activeList[galleryModal.currentIndex].descEn"></p>
                </div>
                <div class="gallery-counter-pill" x-text="(galleryModal.currentIndex + 1) + ' / ' + galleryModal.activeList.length"></div>
            </div>
        </div>
    </div>

</body>
</html>
