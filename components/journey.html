<!-- Political Journey Timeline Component -->
<section class="section section-muted" id="journey">
    <div class="container">
        <div class="section-header">
            <span class="section-tag" x-text="lang === 'ne' ? 'राजनीतिक यात्रा' : 'Political Journey'"></span>
            <h2 class="section-title" x-text="lang === 'ne' ? 'सामाजिक संघर्ष देखि संघीय संसदसम्म' : 'Milestones & Political Journey'"></h2>
            <p class="section-subtitle" x-text="lang === 'ne' ? 'जनताको सेवामा समर्पित दशकौँको निष्ठा र प्रतिबद्धता' : 'From Grassroots Community Activism to Parliamentary Leadership'"></p>
            <div class="section-divider"></div>
        </div>

        <div class="timeline-wrap">
            <template x-for="(item, index) in journey" :key="index">
                <div class="timeline-item">
                    <div class="timeline-content">
                        <span class="timeline-year" x-text="lang === 'ne' ? item.yearNe : item.yearEn"></span>
                        <h4 class="timeline-title" x-text="lang === 'ne' ? item.titleNe : item.titleEn"></h4>
                        <p class="timeline-desc" x-text="lang === 'ne' ? item.descNe : item.descEn"></p>
                    </div>
                    <div class="timeline-dot"></div>
                    <div style="width: 45%;"></div>
                </div>
            </template>
        </div>
    </div>
</section>
