<!-- Contact & Liaison Offices Component -->
<section class="section" id="contact">
    <div class="container">
        <div class="section-header">
            <span class="section-tag" x-text="lang === 'ne' ? 'सम्पर्क तथा सचिवालय' : 'Contact Secretariat'"></span>
            <h2 class="section-title" x-text="lang === 'ne' ? 'सम्पर्क कार्यालयहरू' : 'Official Liaison Offices'"></h2>
            <p class="section-subtitle" x-text="lang === 'ne' ? 'काठमाडौँ तथा इलाम स्थित सचिवालयमा सिधै सम्पर्क गर्नुहोस्' : 'Reach out to the Central Parliamentary Office or Regional Constituency Office'"></p>
            <div class="section-divider"></div>
        </div>

        <div class="contact-grid">
            <!-- Office Addresses -->
            <div>
                <div class="contact-card">
                    <div class="contact-icon"><i class="fas fa-landmark"></i></div>
                    <div class="contact-info">
                        <h4 x-text="lang === 'ne' ? 'केन्द्रीय संसदीय कार्यालय' : 'Central Parliamentary Secretariat'"></h4>
                        <p x-text="profile.centralOffice"></p>
                    </div>
                </div>

                <div class="contact-card">
                    <div class="contact-icon"><i class="fas fa-building-user"></i></div>
                    <div class="contact-info">
                        <h4 x-text="lang === 'ne' ? 'इलाम निर्वाचन क्षेत्र सम्पर्क कार्यालय' : 'Constituency Liaison Office'"></h4>
                        <p x-text="profile.constituencyOffice"></p>
                    </div>
                </div>

                <div class="contact-card">
                    <div class="contact-icon"><i class="fas fa-phone-volume"></i></div>
                    <div class="contact-info">
                        <h4 x-text="lang === 'ne' ? 'फोन तथा हटलाइन' : 'Telephone & Hotline'"></h4>
                        <p x-text="profile.phone"></p>
                    </div>
                </div>

                <div class="contact-card">
                    <div class="contact-icon"><i class="fas fa-envelope-open-text"></i></div>
                    <div class="contact-info">
                        <h4 x-text="lang === 'ne' ? 'आधिकारिक इमेल' : 'Official Email'"></h4>
                        <p x-text="profile.email"></p>
                    </div>
                </div>
            </div>

            <!-- Quick Message Form -->
            <div style="background: var(--bg-card); border: 1px solid var(--border-color); padding: 2rem; border-radius: var(--radius-xl); box-shadow: var(--shadow-md);">
                <h4 style="font-family: var(--font-heading); font-size: 1.35rem; font-weight: 800; color: var(--primary); margin-bottom: 0.5rem;"
                    x-text="lang === 'ne' ? 'सिधै सन्देश पठाउनुहोस्' : 'Send a Direct Message'"></h4>
                <p style="font-size: 0.88rem; color: var(--text-muted); margin-bottom: 1.5rem;"
                   x-text="lang === 'ne' ? 'सुझाव, सल्लाह वा आधिकारिक पत्राचारका लागि फारम भर्नुहोस्:' : 'For inquiries, press queries, or general suggestions:'"></p>

                <form @submit.prevent="alert(lang === 'ne' ? 'सन्देश पठाइयो। धन्यवाद!' : 'Message sent. Thank you!')">
                    <div class="form-group">
                        <label class="form-label" x-text="lang === 'ne' ? 'नाम *' : 'Name *'"></label>
                        <input type="text" class="form-input" required :placeholder="lang === 'ne' ? 'तपाईंको नाम' : 'Your name'">
                    </div>
                    <div class="form-group">
                        <label class="form-label" x-text="lang === 'ne' ? 'इमेल वा फोन *' : 'Email or Phone *'"></label>
                        <input type="text" class="form-input" required :placeholder="lang === 'ne' ? 'इमेल वा मोबाइल' : 'Email or phone'">
                    </div>
                    <div class="form-group">
                        <label class="form-label" x-text="lang === 'ne' ? 'सन्देश *' : 'Message *'"></label>
                        <textarea class="form-textarea" rows="4" required :placeholder="lang === 'ne' ? 'तपाईंको सन्देश...' : 'Your message...'"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        <i class="fas fa-paper-plane"></i>
                        <span x-text="lang === 'ne' ? 'सन्देश पठाउनुहोस्' : 'Send Message'"></span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</section>
