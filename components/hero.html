<!-- Hero Component -->
<section class="hero-section" id="home">
    <div class="hero-bg-pattern"></div>
    <div class="hero-glow"></div>
    <div class="container hero-grid">
        <!-- Hero Left Content -->
        <div class="hero-content">
            <div class="hero-badge-row">
                <span class="hero-badge verified">
                    <i class="fas fa-check-circle"></i>
                    <span x-text="lang === 'ne' ? 'संसदीय आधिकारिक पोर्टल' : 'Official MP Portal'"></span>
                </span>
                <span class="hero-badge">
                    <i class="fas fa-landmark"></i>
                    <span x-text="lang === 'ne' ? 'प्रतिनिधि सभा' : 'House of Representatives'"></span>
                </span>
                <span class="hero-badge">
                    <i class="fas fa-map-marker-alt"></i>
                    <span x-text="lang === 'ne' ? profile.constituencyNe : profile.constituencyEn"></span>
                </span>
            </div>

            <h1 class="hero-name" x-text="lang === 'ne' ? profile.nameNe : profile.nameEn"></h1>
            <p class="hero-role" x-text="lang === 'ne' ? profile.roleNe : profile.roleEn"></p>
            <p class="hero-tagline" x-text="lang === 'ne' ? '“' + profile.taglineNe + '”' : '“' + profile.taglineEn + '”'"></p>
            <p class="hero-bio" x-text="lang === 'ne' ? profile.bioNe : profile.bioEn"></p>

            <div class="hero-cta-group">
                <a href="#gunaso" class="btn btn-accent btn-lg">
                    <i class="fas fa-headset"></i>
                    <span x-text="lang === 'ne' ? 'जनगुनासो दर्ता गर्नुहोस्' : 'Citizen Grievance Portal'"></span>
                </a>
                <button class="btn btn-outline btn-lg" style="color: #ffffff; border-color: rgba(255,255,255,0.3);" @click="appointmentModal.isOpen = true">
                    <i class="fas fa-calendar-check"></i>
                    <span x-text="lang === 'ne' ? 'भेटघाट समय लिनुहोस्' : 'Request Appointment'"></span>
                </button>
                <a href="#media" class="btn btn-outline btn-lg" style="color: #ffffff; border-color: rgba(255,255,255,0.3);">
                    <i class="fas fa-play-circle"></i>
                    <span x-text="lang === 'ne' ? 'संसदीय भाषणहरू' : 'Speeches in Parliament'"></span>
                </a>
            </div>
        </div>

        <!-- Hero Right Portrait -->
        <div class="hero-portrait-wrap">
            <div class="hero-portrait-card">
                <img :src="profile.photoUrl" :alt="profile.nameEn" class="hero-portrait-img">
                <div class="hero-portrait-badge">
                    <div class="hero-portrait-info">
                        <h4 x-text="lang === 'ne' ? profile.nameNe : profile.nameEn"></h4>
                        <p x-text="lang === 'ne' ? profile.partyNe + ' • ' + profile.constituencyNe : profile.partyEn + ' • ' + profile.constituencyEn"></p>
                    </div>
                    <img :src="profile.partyLogoUrl" alt="Party Emblem" class="hero-party-icon"
                         onerror="this.style.display='none'">
                </div>
            </div>
        </div>
    </div>
</section>
